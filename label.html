<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת הדפסת מדבקות</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap');
        body { font-family: 'Rubik', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-8">
        
        <header class="border-b border-gray-200 pb-4">
            <h1 class="text-3xl font-bold text-blue-600">מערכת ניהול הדפסת מדבקות</h1>
            <p class="text-gray-500 mt-1">שליחת משימות הדפסה וצפייה בתור ובקובץ ההיסטוריה</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-xs border border-gray-100 h-fit">
                <h2 class="text-xl font-semibold mb-4 text-gray-700 border-b pb-2">הדפסת מדבקה חדשה</h2>
                
                <form id="labelForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">טקסט למדבקה</label>
                        <textarea id="text" rows="2" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-hidden" placeholder="שורה 1&#10;שורה 2" required></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">ברקוד (אופציונלי)</label>
                        <input type="text" id="barcode" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-hidden" placeholder="למשל: 7290011580102">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">עותקים</label>
                            <input type="number" id="copies" value="1" min="1" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-hidden" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">גודל גופן</label>
                            <input type="number" id="font_size" value="21" min="10" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-hidden" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">יישור טקסט</label>
                            <select id="text_align" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-hidden">
                                <option value="right">ימין</option>
                                <option value="center">מרכז</option>
                                <option value="left">שמאל</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600 mb-1">מיקום ברקוד</label>
                            <select id="layout" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-hidden">
                                <option value="text_top">טקסט למעלה</option>
                                <option value="barcode_top">ברקוד למעלה</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors cursor-pointer shadow-md mt-2">
                        שלח לתור ההדפסה
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 space-y-4">
                <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-xs border border-gray-100">
                    <h2 class="text-xl font-semibold text-gray-700">תור והיסטוריית הדפסות</h2>
                    <button onclick="fetchHistory()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors cursor-pointer flex items-center gap-2">
                        🔄 רענן נתונים
                    </button>
                </div>

                <div class="bg-white rounded-xl shadow-xs border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full border-collapse text-right">
                            <thead>
                                <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-sm font-medium">
                                    <th class="p-4 w-12">ID</th>
                                    <th class="p-4">תוכן המדבקה</th>
                                    <th class="p-4">ברקוד</th>
                                    <th class="p-4 w-20 text-center">עותקים</th>
                                    <th class="p-4 w-28 text-center">סטטוס</th>
                                    <th class="p-4 w-24 text-center">פעולות</th>
                                </tr>
                            </thead>
                            <tbody id="historyTableBody" class="divide-y divide-gray-100 text-sm">
                                <tr>
                                    <td colspan="6" class="p-8 text-center text-gray-400">טוען נתונים...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const URL = "https://rwlhmbghdtuofnimizmf.supabase.co/rest/v1/print_queue";
        const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3bGhtYmdoZHR1b2ZuaW1pem1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMzIyOTQsImV4cCI6MjA5NjgwODI5NH0.v5bF_XZbI8hrqyaRED1a75gXYIlpG6rntAG0sheqdjM";
        
        const HEADERS = {
            "apikey": KEY,
            "Authorization": "Bearer " + KEY,
            "Content-Type": "application/json"
        };

        // פונקציה לעיצוב תגית הסטטוס
        function getStatusBadge(status) {
            const styles = {
                'pending': 'bg-amber-50 text-amber-700 border-amber-200',
                'printing': 'bg-blue-50 text-blue-700 border-blue-200',
                'printed': 'bg-green-50 text-green-700 border-green-200',
                'error': 'bg-red-50 text-red-700 border-red-200'
            };
            const labels = {
                'pending': 'ממתין',
                'printing': 'בהדפסה',
                'printed': 'הודפס',
                'error': 'שגיאה'
            };
            return `<span class="px-2.5 py-1 text-xs font-medium border rounded-full ${styles[status] || 'bg-gray-50'}">${labels[status] || status}</span>`;
        }

        // קריאת ההיסטוריה מה-API
        async function fetchHistory() {
            try {
                const response = await fetch(`${URL}?select=*&order=created_at.desc&limit=20`, { headers: HEADERS });
                if (!response.ok) throw new Error('שגיאה במשיכת הנתונים');
                
                const data = await response.json();
                const tbody = document.getElementById('historyTableBody');
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">אין מדבקות בהיסטוריה</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(row => {
                    const label = row.label_data || {};
                    // החלפת ירידות שורה לתצוגה נוחה בטבלה
                    const textPreview = (label.text || '').replace(/\n/g, ' | ');
                    
                    return `
                        <tr class="hover:bg-gray-50 transition-colors">
                            <td class="p-4 font-mono text-gray-400">#${row.id}</td>
                            <td class="p-4 font-medium text-gray-900 max-w-xs truncate" title="${label.text || ''}">${textPreview}</td>
                            <td class="p-4 font-mono text-gray-500">${label.barcode || '-'}</td>
                            <td class="p-4 text-center text-gray-600">${label.copies || 1}</td>
                            <td class="p-4 text-center">${getStatusBadge(row.status)}</td>
                            <td class="p-4 text-center">
                                <button onclick='reprint(${JSON.stringify(label)})' class="text-blue-600 hover:text-blue-800 font-medium text-xs bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded transition-colors cursor-pointer">
                                    הדפס שוב
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error(error);
                document.getElementById('historyTableBody').innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500 font-medium">שגיאה בתקשורת עם השרת</td></tr>`;
            }
        }

        // שליחת מדבקה חדשה
        document.getElementById('labelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const label_data = {
                text: document.getElementById('text').value,
                barcode: document.getElementById('barcode').value || undefined,
                copies: parseInt(document.getElementById('copies').value) || 1,
                font_size: parseInt(document.getElementById('font_size').value) || 21,
                text_align: document.getElementById('text_align').value,
                layout: document.getElementById('layout').value
            };

            await sendToQueue(label_data);
            document.getElementById('text').value = '';
            document.getElementById('barcode').value = '';
        });

        // פונקציה גנרית לשליחת אובייקט label_data לתור
        async function sendToQueue(labelData) {
            try {
                const response = await fetch(URL, {
                    method: "POST",
                    headers: HEADERS,
                    body: JSON.stringify({ label_data: labelData })
                });

                if (!response.ok) throw new Error('השליחה נכשלה');
                
                // רענון מיידי של הטבלה
                fetchHistory();
            } catch (error) {
                alert('שגיאה בשליחת המדבקה לתור: ' + error.message);
            }
        }

        // הדפסה חוזרת
        function reprint(labelData) {
            // שליחה מחדש של אותם נתונים בדיוק כפי שהוגדרו ב-API
            sendToQueue(labelData);
        }

        // טעינה ראשונית בפתח הדף
        fetchHistory();
    </script>
</body>
</html>

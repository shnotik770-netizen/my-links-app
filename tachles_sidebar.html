<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TachlesPDF — Wide Tools Panel</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0b15;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Heebo',sans-serif;
  direction:rtl;
  color:#fff;
}

.app{
  width:980px;
  height:680px;
  background:#141420;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  box-shadow:
    0 30px 90px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.03);
}

/* ========= TOOLS PANEL ========= */

.tools-panel{
  width:290px;
  background:#1a1a28;
  border-left:1px solid #2a2a3e;
  display:flex;
  flex-direction:column;
}

.panel-header{
  padding:18px 18px 14px;
  border-bottom:1px solid #2a2a3e;
}

.logo{
  font-size:22px;
  font-weight:700;
  color:#f4f4f7;
}

.logo span{
  color:#4d9fff;
}

.sub{
  margin-top:4px;
  color:#6f718f;
  font-size:12px;
}

.tools-grid{
  padding:16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  overflow-y:auto;
}

.group{
  background:#202032;
  border:1px solid #2d2d46;
  border-radius:14px;
  padding:12px;
}

.group-title{
  font-size:11px;
  color:#8f91b0;
  margin-bottom:10px;
  font-weight:600;
  letter-spacing:.4px;
}

.tool-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.tool-btn{
  width:100%;
  height:56px;
  border:none;
  background:#26263b;
  border-radius:12px;
  color:#9ca0c5;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  cursor:pointer;
  transition:.18s ease;
  position:relative;
  border:1px solid transparent;
}

.tool-btn:hover{
  background:#30304a;
  color:#eef2ff;
  transform:translateY(-1px);
}

.tool-btn.active{
  background:#1d2947;
  color:#58a6ff;
  border-color:#2e5fa8;
  box-shadow:0 0 0 1px rgba(88,166,255,.15);
}

.tool-btn i{
  font-size:20px;
  flex-shrink:0;
}

.tool-info{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.tool-name{
  font-size:13px;
  font-weight:600;
}

.tool-desc{
  font-size:10px;
  color:#72759a;
  margin-top:2px;
}

.tool-btn.active .tool-desc{
  color:#8ebfff;
}

.full{
  grid-column:1 / -1;
}

/* ========= MAIN AREA ========= */

.main{
  flex:1;
  background:#12121d;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:62px;
  border-bottom:1px solid #252538;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.doc-name{
  display:flex;
  align-items:center;
  gap:10px;
  color:#d9d9e5;
  font-size:14px;
}

.doc-name i{
  color:#4d9fff;
  font-size:18px;
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
}

.badge{
  background:#1d2947;
  color:#69afff;
  border:1px solid #2e5fa8;
  border-radius:999px;
  padding:5px 12px;
  font-size:11px;
}

.canvas{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.page{
  width:340px;
  height:470px;
  background:#f6f2ea;
  border-radius:6px;
  box-shadow:
    0 10px 35px rgba(0,0,0,.5),
    0 0 0 1px rgba(255,255,255,.08);
  position:relative;
}

.page-inner{
  padding:28px;
}

.line{
  height:9px;
  background:#d4cec3;
  border-radius:3px;
  margin-bottom:11px;
}

.short{ width:70%; }
.shorter{ width:45%; }

.selection{
  position:absolute;
  top:145px;
  right:55px;
  width:180px;
  height:95px;
  border:2px dashed #4d9fff;
  background:rgba(77,159,255,.08);
  border-radius:6px;
}

.selection::before{
  content:'אזור בחירה';
  position:absolute;
  top:-28px;
  right:0;
  background:#4d9fff;
  color:#fff;
  font-size:11px;
  padding:4px 10px;
  border-radius:999px;
}

.footer-status{
  height:42px;
  border-top:1px solid #252538;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  color:#7a7c99;
  font-size:12px;
}

/* ========= TOOLTIP ========= */

.tooltip{
  position:absolute;
  left:calc(100% + 10px);
  top:50%;
  transform:translateY(-50%);
  background:#30304a;
  color:#fff;
  font-size:11px;
  padding:6px 10px;
  border-radius:8px;
  opacity:0;
  pointer-events:none;
  transition:.15s;
  white-space:nowrap;
  border:1px solid #40405e;
}

.tool-btn:hover .tooltip{
  opacity:1;
}

</style>
</head>

<body>

<div class="app">

  <!-- TOOLS -->

  <aside class="tools-panel">

    <div class="panel-header">
      <div class="logo">Tachles<span>PDF</span></div>
      <div class="sub">מערכת עריכה מתקדמת למסמכי PDF</div>
    </div>

    <div class="tools-grid">

      <div class="group">
        <div class="group-title">היסטוריה</div>

        <div class="tool-list">

          <button class="tool-btn" onclick="setActive(this)">
            <i class="ti ti-arrow-back-up"></i>

            <div class="tool-info">
              <div class="tool-name">ביטול</div>
              <div class="tool-desc">חזור פעולה אחת</div>
            </div>

            <div class="tooltip">Ctrl + Z</div>
          </button>

          <button class="tool-btn" onclick="setActive(this)">
            <i class="ti ti-arrow-forward-up"></i>

            <div class="tool-info">
              <div class="tool-name">בצע שוב</div>
              <div class="tool-desc">שחזור פעולה</div>
            </div>

            <div class="tooltip">Ctrl + Y</div>
          </button>

        </div>
      </div>

      <div class="group">
        <div class="group-title">סיבוב</div>

        <div class="tool-list">

          <button class="tool-btn" onclick="pulse(this)">
            <i class="ti ti-rotate"></i>

            <div class="tool-info">
              <div class="tool-name">90° ימינה</div>
              <div class="tool-desc">סיבוב עמוד</div>
            </div>
          </button>

          <button class="tool-btn" onclick="pulse(this)">
            <i class="ti ti-rotate-clockwise-2"></i>

            <div class="tool-info">
              <div class="tool-name">180°</div>
              <div class="tool-desc">היפוך מלא</div>
            </div>
          </button>

        </div>
      </div>

      <!-- מאוחד -->

      <div class="group full">
        <div class="group-title">עריכה ומחיקה</div>

        <div class="tool-list">

          <button class="tool-btn active" onclick="setActive(this)">
            <i class="ti ti-pointer"></i>

            <div class="tool-info">
              <div class="tool-name">בחירה והזזה</div>
              <div class="tool-desc">סימון אזורים במסמך</div>
            </div>

            <div class="tooltip">בחירה / הזזה</div>
          </button>

          <button class="tool-btn" onclick="setActive(this)">
            <i class="ti ti-crop"></i>

            <div class="tool-info">
              <div class="tool-name">חיתוך</div>
              <div class="tool-desc">חיתוך תוכן מהעמוד</div>
            </div>

            <div class="tooltip">Crop Tool</div>
          </button>

          <button class="tool-btn" onclick="setActive(this)">
            <i class="ti ti-scissors"></i>

            <div class="tool-info">
              <div class="tool-name">מחיקה חיצונית</div>
              <div class="tool-desc">הסר מחוץ לאזור</div>
            </div>
          </button>

          <button class="tool-btn" onclick="setActive(this)">
            <i class="ti ti-eraser"></i>

            <div class="tool-info">
              <div class="tool-name">מחיקת בחירה</div>
              <div class="tool-desc">מחיקה מתוך הסימון</div>
            </div>
          </button>

        </div>
      </div>

      <div class="group full">
        <div class="group-title">הוספה</div>

        <div class="tool-list">

          <button class="tool-btn" onclick="setActive(this)">
            <i class="ti ti-text-size"></i>

            <div class="tool-info">
              <div class="tool-name">טקסט</div>
              <div class="tool-desc">הוסף טקסט למסמך</div>
            </div>
          </button>

          <button class="tool-btn" onclick="setActive(this)">
            <i class="ti ti-photo-plus"></i>

            <div class="tool-info">
              <div class="tool-name">תמונה</div>
              <div class="tool-desc">הטמעת תמונה בעמוד</div>
            </div>
          </button>

          <button class="tool-btn" onclick="setActive(this)">
            <i class="ti ti-copy"></i>

            <div class="tool-info">
              <div class="tool-name">שכפול אזור</div>
              <div class="tool-desc">העתקה לעמודים נוספים</div>
            </div>
          </button>

        </div>
      </div>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <div class="topbar">

      <div class="doc-name">
        <i class="ti ti-file-type-pdf"></i>
        <span>document.pdf</span>
      </div>

      <div class="status">
        <div class="badge" id="active-chip">בחירה והזזה פעיל</div>
      </div>

    </div>

    <div class="canvas">

      <div class="page">

        <div class="page-inner">

          <div class="line"></div>
          <div class="line short"></div>
          <div class="line"></div>
          <div class="line shorter"></div>

          <div style="height:25px"></div>

          <div class="line"></div>
          <div class="line"></div>
          <div class="line short"></div>

          <div style="height:35px"></div>

          <div class="line"></div>
          <div class="line"></div>
          <div class="line shorter"></div>

        </div>

        <div class="selection"></div>

      </div>

    </div>

    <div class="footer-status">
      <span>עמוד 3 מתוך 12</span>
      <span>זום 100% · 148×210mm</span>
    </div>

  </main>

</div>

<script>

function setActive(btn){

  document
    .querySelectorAll('.tool-btn')
    .forEach(b => b.classList.remove('active'));

  btn.classList.add('active');

  const label = btn.querySelector('.tool-name')?.textContent;

  document.getElementById('active-chip').textContent =
    label + ' פעיל';
}

function pulse(btn){

  btn.style.transform = 'scale(.97)';
  btn.style.background = '#1d2947';
  btn.style.color = '#58a6ff';

  setTimeout(() => {

    btn.style.transform = '';
    btn.style.background = '';
    btn.style.color = '';

  }, 220);
}

</script>

</body>
</html>

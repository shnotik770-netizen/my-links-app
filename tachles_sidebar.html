<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תכלעס PDF — ממשק מאוחד</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d18;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Heebo', sans-serif;
    direction: rtl;
    color: #e1e1e6;
  }

  .app-container {
    display: flex;
    height: 700px;
    width: 1000px;
    background: #13131f;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 100px rgba(0,0,0,0.7);
    border: 1px solid #2a2a3e;
  }

  /* סרגל צדי */
  .sidebar {
    width: 180px;
    background: #1e1e2d;
    border-left: 1px solid #2a2a3e;
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    flex-shrink: 0;
    transition: width 0.3s ease;
    position: relative;
  }

  .sidebar.collapsed {
    width: 65px;
  }

  .sidebar-toggle {
    position: absolute;
    top: 15px;
    left: -18px;
    width: 32px;
    height: 32px;
    background: #1e1e2d;
    border: 1px solid #2a2a3e;
    border-radius: 50%;
    color: #ffd700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    z-index: 10;
    transition: all 0.2s ease;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
  }
  
  .sidebar-toggle:hover { background: #4d9fff; color: white; }
  .sidebar.collapsed .sidebar-toggle .ti { transform: rotate(180deg); }

  .sidebar-header {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffd700;
    font-weight: 600;
    border-bottom: 1px solid #2a2a3e;
    font-size: 13px;
    margin-bottom: 12px;
  }

  .sidebar.collapsed .sidebar-header { display: none; }

  .group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    padding: 0 10px 10px 10px;
    margin-bottom: 8px;
    gap: 10px;
  }

  .sidebar.collapsed .group + .group {
    border-top: 1px solid #2a2a3e;
    padding-top: 12px;
  }

  .group-label {
    font-size: 10px;
    color: #5c5c7d;
    font-weight: 600;
    width: 100%;
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .sidebar.collapsed .group-label { display: none; }

  .tool-btn {
    position: relative;
    width: 75px;
    height: 70px;
    border: none;
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all 0.2s ease;
    color: #8888a8;
  }

  .sidebar.collapsed .tool-btn { width: 55px; height: 55px; }

  .tool-btn:hover { background: #2d2d3f; color: #ffffff; }
  .tool-btn.active { background: #1a2340; color: #4d9fff; box-shadow: inset 0 0 0 1px #4d9fff33; }

  .tool-btn.active::after {
    content: '';
    position: absolute;
    right: 0;
    top: 15%;
    height: 70%;
    width: 3px;
    background: #4d9fff;
    border-radius: 4px 0 0 4px;
  }

  .tool-btn .ti { font-size: 24px; }
  .tool-btn .btn-label { font-size: 10px; font-weight: 500; text-align: center; }
  .sidebar.collapsed .tool-btn .btn-label { display: none; }

  .rotate-row { display: flex; width: 100%; gap: 5px; justify-content: center; flex-wrap: wrap; }
  .sidebar.collapsed .rotate-row { flex-direction: column; gap: 8px; }

  .rotate-btn {
    flex: 1;
    min-width: 48px;
    height: 48px;
    background: #252538;
    border: none;
    border-radius: 6px;
    color: #8888a8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .rotate-btn:hover { background: #4d9fff; color: white; }

  /* תוכן מרכזי */
  .main-area { flex: 1; display: flex; flex-direction: column; background: #0f0f1a; }
  .top-nav { height: 50px; background: #1e1e2d; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; border-bottom: 1px solid #2a2a3e; }
  .status-tag { background: #1a2340; color: #4d9fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }

  .canvas { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
  .pdf-page { width: 320px; height: 450px; background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.5); padding: 30px; display: flex; flex-direction: column; gap: 15px; }
  .mock-img { width: 100%; height: 180px; background: #f0f0f5; border: 1px dashed #d1d1e0; }

  .light-banner { background: linear-gradient(90deg, #1e1e2d, #2d2d45); padding: 8px; text-align: center; font-size: 11px; color: #4d9fff; border-top: 1px solid #2a2a3e; }
</style>
</head>
<body>

<div class="app-container">
  
  <div class="main-area">
    <div class="top-nav">
      <div style="font-size: 13px; color: #a1a1c2;">
        <i class="ti ti-file-pdf"></i> document_ready.pdf
        <span class="status-tag" id="active-tool" style="margin-right:10px;">כלי בחירה פעיל</span>
      </div>
      <div style="color:#5c5c7d; font-size:12px;">תכלעס PDF v1.3.0</div>
    </div>

    <div class="canvas">
      <div class="pdf-page">
        <div class="mock-img"></div>
        <div style="height:10px; background:#e6e6f0; width:100%;"></div>
        <div style="height:10px; background:#e6e6f0; width:60%;"></div>
      </div>
    </div>

    <div class="light-banner">
      בכל פעולה קטנה מוסיפים אור בעולם. יחי המלך המשיח!
    </div>
  </div>

  <div class="sidebar" id="appSidebar">
    <button class="sidebar-toggle" onclick="toggleSidebarWidth()">
        <i class="ti ti-chevron-left"></i>
    </button>

    <div class="sidebar-header">תכלעס פקודות</div>

    <!-- קבוצה 1: היסטוריה -->
    <div class="group">
      <div class="group-label">היסטוריה</div>
      <button class="tool-btn" onclick="updateTool('ביטול', this)">
        <i class="ti ti-arrow-back-up"></i>
        <span class="btn-label">ביטול</span>
      </button>
      <button class="tool-btn" onclick="updateTool('בצע שוב', this)">
        <i class="ti ti-arrow-forward-up"></i>
        <span class="btn-label">בצע שוב</span>
      </button>
    </div>

    <!-- קבוצה מאוחדת: עריכה ומחיקה -->
    <div class="group">
      <div class="group-label">כלי עריכה</div>
      <button class="tool-btn active" onclick="updateTool('כלי בחירה', this)">
        <i class="ti ti-pointer"></i>
        <span class="btn-label">כלי בחירה</span>
      </button>
      <button class="tool-btn" onclick="updateTool('חיתוך (Crop)', this)">
        <i class="ti ti-crop"></i>
        <span class="btn-label">חיתוך</span>
      </button>
      <button class="tool-btn" onclick="updateTool('חיתוך חיצוני', this)">
        <i class="ti ti-scissors"></i>
        <span class="btn-label">חיתוך חוץ</span>
      </button>
      <button class="tool-btn" onclick="updateTool('מחיקת בחירה', this)">
        <i class="ti ti-eraser"></i>
        <span class="btn-label">מחיקת פנים</span>
      </button>
    </div>

    <!-- קבוצה 3: הוספה -->
    <div class="group">
      <div class="group-label">הוספה</div>
      <button class="tool-btn" onclick="updateTool('הוספת טקסט', this)">
        <i class="ti ti-text-size"></i>
        <span class="btn-label">טקסט</span>
      </button>
      <button class="tool-btn" onclick="updateTool('הוספת תמונה', this)">
        <i class="ti ti-photo-plus"></i>
        <span class="btn-label">תמונה</span>
      </button>
      <button class="tool-btn" onclick="updateTool('שכפול אזור', this)">
        <i class="ti ti-copy"></i>
        <span class="btn-label">שכפול</span>
      </button>
    </div>

    <!-- קבוצה 4: סיבוב -->
    <div class="group">
      <div class="group-label">סיבוב</div>
      <div class="rotate-row">
        <button class="rotate-btn" onclick="flash(this)"><i class="ti ti-rotate-2"></i></button>
        <button class="rotate-btn" onclick="flash(this)"><i class="ti ti-rotate-clockwise-2"></i></button>
        <button class="rotate-btn" onclick="flash(this)"><i class="ti ti-rotate"></i></button>
      </div>
    </div>
  </div>

</div>

<script>
  function updateTool(name, btn) {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('active-tool').textContent = name + ' פעיל';
  }

  function flash(btn) {
    btn.style.background = '#4d9fff';
    btn.style.color = 'white';
    setTimeout(() => { btn.style.background = ''; btn.style.color = ''; }, 200);
  }

  function toggleSidebarWidth() {
    document.getElementById('appSidebar').classList.toggle('collapsed');
  }
</script>

</body>
</html>

// ============================================================
// GEMATRIA
// ============================================================
function gem(n){
  if(n<=0) return String(n);
  var ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  var tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  var hundreds=['','ק','ר','ש','ת'];
  var result='',rem=n;
  var h=Math.floor(rem/100);
  if(h>=5){result+='\u05ea';rem-=400;h=Math.floor(rem/100);}
  if(h>0){result+=hundreds[h];rem-=h*100;}
  if(rem===15){result+='\u05d8\u05d5';rem=0;}
  else if(rem===16){result+='\u05d8\u05d6';rem=0;}
  else{
    var t=Math.floor(rem/10);
    if(t>0){result+=tens[t];rem-=t*10;}
    if(rem>0){result+=ones[rem];}
  }
  if(result.length===1) return result+'\u05f3';
  return result.slice(0,-1)+'\u05f4'+result.slice(-1);
}
function hYearStr(hy){return gem(hy%1000);}

// ============================================================
// HEBREW MONTHS
// ============================================================
var HM={
  'Tishrei':'\u05ea\u05e9\u05e8\u05d9','Cheshvan':'\u05d7\u05e9\u05d5\u05df',
  'Kislev':'\u05db\u05e1\u05dc\u05d5','Tevet':'\u05d8\u05d1\u05ea',
  'Shvat':'\u05e9\u05d1\u05d8',"Sh'vat":'\u05e9\u05d1\u05d8',
  'Adar':'\u05d0\u05d3\u05e8','Adar I':'\u05d0\u05d3\u05e8 \u05d0\u05f3',
  'Adar II':'\u05d0\u05d3\u05e8 \u05d1\u05f3','Nisan':'\u05e0\u05d9\u05e1\u05df',
  'Iyar':'\u05d0\u05d9\u05d9\u05e8','Sivan':'\u05e1\u05d9\u05d5\u05df',
  'Tamuz':'\u05ea\u05de\u05d5\u05d6','Av':'\u05d0\u05d1','Elul':'\u05d0\u05dc\u05d5\u05dc'
};
var MR=['Tishrei','Cheshvan','Kislev','Tevet',"Sh'vat",'Adar','Nisan','Iyar','Sivan','Tamuz','Av','Elul'];
var ML=['Tishrei','Cheshvan','Kislev','Tevet',"Sh'vat",'Adar I','Adar II','Nisan','Iyar','Sivan','Tamuz','Av','Elul'];
function hmn(api){return HM[api]||api;}
function isLeap(hy){return((7*hy+1)%19)<7;}

function normalizeBirthMonth(birthHM,forYear){
  if(birthHM==='Shvat') birthHM="Sh'vat";
  var leap=isLeap(forYear);
  if(!leap){if(birthHM==='Adar I'||birthHM==='Adar II') return 'Adar'; return birthHM;}
  else{if(birthHM==='Adar') return 'Adar II'; return birthHM;}
}

// ============================================================
// BUILD STUDY MONTHS (ספירה ממשית)
// ============================================================
function buildStudyMonths(birthHM_api,birthHD,lastBirthHY){
  var nextBirthHY=lastBirthHY+1;
  var birthdayIsRoshChodesh=(birthHD===1);
  var bmLast=normalizeBirthMonth(birthHM_api,lastBirthHY);
  var bmNext=normalizeBirthMonth(birthHM_api,nextBirthHY);
  var curY=lastBirthHY;
  var curList=isLeap(curY)?ML:MR;
  var startIdx=curList.indexOf(bmLast);
  if(startIdx===-1) startIdx=0;
  var curIdx=startIdx+1;
  if(curIdx>=curList.length){curY++;curList=isLeap(curY)?ML:MR;curIdx=0;}
  var months=[];
  for(var i=0;i<14;i++){
    if(curIdx>=curList.length){curY++;curList=isLeap(curY)?ML:MR;curIdx=0;}
    var hm=curList[curIdx];
    if(curY===nextBirthHY&&hm===bmNext){
      if(!birthdayIsRoshChodesh) months.push({hy:curY,hm:hm,hmn:hmn(hm)});
      break;
    }
    if(curY>nextBirthHY) break;
    months.push({hy:curY,hm:hm,hmn:hmn(hm)});
    curIdx++;
  }
  return months;
}

// ============================================================
// DISTRIBUTE VERSES
// ============================================================
function distributeVerses(V,M){
  var mult=1;
  while(V*mult<M) mult++;
  var totalV=V*mult,base=Math.floor(totalV/M),remainder=totalV%M;
  var result=[],cur=0;
  for(var i=0;i<M;i++){
    var count=(i<remainder)?(base+1):base,segs=[],left=count,pos=cur;
    while(left>0){var space=V-pos,take=Math.min(left,space);segs.push([pos+1,pos+take]);pos=(pos+take)%V;left-=take;}
    result.push(segs);cur=(cur+count)%V;
  }
  return result;
}
function formatSegs(segs){
  var disp=[],num=[];
  for(var i=0;i<segs.length;i++){
    var s=segs[i];
    disp.push(s[0]===s[1]?gem(s[0]):gem(s[0])+'\u2013'+gem(s[1]));
    num.push(s[0]===s[1]?String(s[0]):s[0]+'-'+s[1]);
  }
  return{display:disp.join(', '),numeric:num.join(', ')};
}

// ============================================================
// HEBCAL API
// ============================================================
var hcCache={};
async function gregToHeb(dateObj){
  var k='g'+dateObj.toISOString().split('T')[0];
  if(hcCache[k]) return hcCache[k];
  var y=dateObj.getFullYear(),m=dateObj.getMonth()+1,d=dateObj.getDate();
  var j=await(await fetch('https://www.hebcal.com/converter?v=1&cfg=json&gy='+y+'&gm='+m+'&gd='+d+'&g2h=1')).json();
  hcCache[k]=j; return j;
}
async function hebToGreg(hy,hm,hd){
  var k='h'+hy+'-'+hm+'-'+hd;
  if(hcCache[k]) return hcCache[k];
  var j=await(await fetch('https://www.hebcal.com/converter?v=1&cfg=json&hy='+hy+'&hm='+encodeURIComponent(hm)+'&hd='+hd+'&h2g=1')).json();
  if(j.error) return null;
  hcCache[k]=j; return j;
}
async function findMonthIdx(studyMonths,refDate){
  var idx=0;
  for(var i=0;i<studyMonths.length;i++){
    var g=await hebToGreg(studyMonths[i].hy,studyMonths[i].hm,1);
    var d=g&&g.gy?new Date(g.gy,g.gm-1,g.gd):null;
    if(d&&d<=refDate) idx=i; else break;
  }
  return idx;
}

// ============================================================
// SEFARIA API — fetch chapter with commentaries
// ============================================================
var sefCache={};
// Map commentary names from Sefaria to our keys
var COMM_MAP={
  'Rashi':'rashi','Radak':'radak',
  'Metzudat David':'metzudot','Metzudat Zion':'metzudot',
  'Ibn Ezra':'ibnezra'
};
var COMM_LABELS={rashi:'רש״י',metzudot:'מצודות',radak:'רד״ק',ibnezra:'אבן עזרא'};

async function fetchPsalmData(chapter,vFrom,vTo){
  // Build ref e.g. "Psalms.32.3-4" or "Psalms.32.3" 
  var ref='Psalms.'+chapter+'.'+(vFrom===vTo?vFrom:vFrom+'-'+vTo);
  if(sefCache[ref]) return sefCache[ref];
  // Fetch text
  var textUrl='https://www.sefaria.org/api/v3/texts/'+encodeURIComponent('Psalms '+chapter+':'+vFrom+(vFrom===vTo?'':'-'+vTo))+'?lang=he&version=hebrew';
  // Fetch links/commentary
  var linkUrl='https://www.sefaria.org/api/links/Psalms.'+chapter+'.'+vFrom+(vFrom===vTo?'':'-'+vTo)+'?with_text=1&lang=he';
  try{
    var [textResp,linkResp]=await Promise.all([fetch(textUrl),fetch(linkUrl)]);
    var textData=await textResp.json();
    var linkData=await linkResp.json();
    var result={verses:[],commentary:{}};
    // Parse verses
    var heText=[];
    if(textData.versions&&textData.versions.length>0){
      var v=textData.versions[0];
      heText=Array.isArray(v.text)?v.text:[v.text];
    }
    for(var i=0;i<heText.length;i++){
      result.verses.push({num:vFrom+i,text:heText[i]||''});
      result.commentary[vFrom+i]={rashi:[],metzudot:[],radak:[],ibnezra:[]};
    }
    // Parse commentary from links
    if(Array.isArray(linkData)){
      for(var li=0;li<linkData.length;li++){
        var lnk=linkData[li];
        var cat=lnk.collectiveTitle&&lnk.collectiveTitle.en;
        var key=COMM_MAP[cat];
        if(!key) continue;
        var heComm=lnk.he||'';
        if(!heComm) continue;
        // Figure out which verse this commentary is on
        // anchorRef looks like "Psalms 32:3"
        var aref=lnk.anchorRef||'';
        var vm=aref.match(/:(\d+)/);
        var vnum=vm?parseInt(vm[1]):vFrom;
        if(result.commentary[vnum]&&result.commentary[vnum][key]!==undefined){
          result.commentary[vnum][key].push(heComm);
        }
      }
    }
    sefCache[ref]=result;
    return result;
  }catch(e){
    console.error('Sefaria fetch error',e);
    return null;
  }
}

  document.getElementById('share-link-text').textContent=shareUrl;

  // load content
  var content=document.getElementById('viewer-content');
  content.innerHTML='<div class="viewer-loading">&#x23F3; טוען טקסט מספריא...</div>';
  var data=await fetchPsalmData(chapter,vFrom,vTo);
  if(!data){
    content.innerHTML='<div class="error-msg">לא ניתן לטעון את הטקסט מספריא. אנא נסה שנית.</div>';
    return;
  }
  var html='';
  for(var i=0;i<data.verses.length;i++){
    var v=data.verses[i];
    var comm=data.commentary[v.num]||{rashi:[],metzudot:[],radak:[],ibnezra:[]};
    html+='<div class="pasuk-block">';
    html+='<div class="pasuk-num">פסוק '+gem(v.num)+'</div>';
    html+='<div class="pasuk-text">'+stripHtml(v.text)+'</div>';
    html+='<div class="commentary-block">';
    ['rashi','metzudot','radak','ibnezra'].forEach(function(key){
      var texts=comm[key]||[];
      var display=activeComms[key]?'block':'none';
      if(texts.length>0){
        html+='<div class="commentary-item '+key+'" style="display:'+display+'">';
        html+='<div class="commentary-label '+key+'">'+COMM_LABELS[key]+'</div>';
        texts.forEach(function(t){
          html+='<div class="commentary-text">'+stripHtml(t)+'</div>';
        });
        html+='</div>';
      }
    });
    html+='</div></div>';
  }
  if(!html) html='<div class="error-msg">לא נמצאו פסוקים.</div>';
  content.innerHTML=html;
}

function copyShareLink(){
  var txt=document.getElementById('share-link-text').textContent;
  navigator.clipboard.writeText(txt).then(function(){
    var btn=document.querySelector('.copy-btn');
    btn.textContent='\u2713 הועתק!';
    setTimeout(function(){btn.textContent='\uD83D\uDCCB \u05D4\u05E2\u05EA\u05E7';},2000);
  });
}

// Parse hash on load: #chapter/part-total/vFrom-vTo
async function loadFromHash(){
  var hash=window.location.hash.replace('#','');
  if(!hash) return;
  var parts=hash.split('/');
  if(parts.length<3) return;
  var chapter=parseInt(parts[0]);
  var pt=parts[1].split('-');
  var partNum=parseInt(pt[0]),totalParts=parseInt(pt[1])||'?';
  var vp=parts[2].split('-');
  var vFrom=parseInt(vp[0]),vTo=parseInt(vp[1]||vp[0]);
  if(isNaN(chapter)||isNaN(vFrom)) return;
  var psalmLabel=vFrom===vTo?gem(vFrom):gem(vFrom)+'\u2013'+gem(vTo);
  await showViewer(chapter,partNum,totalParts,vFrom,vTo,'','');
}

// ============================================================
// CALCULATOR
// ============================================================
async function calculate(){
  var inp=document.getElementById('dateInput').value;
  if(!inp){alert('הזן תאריך לידה');return;}
  await calcAndShow(inp,false);
}
async function addToList(){
  var inp=document.getElementById('dateInput').value;
  if(!inp){alert('הזן תאריך לידה');return;}
  await calcAndShow(inp,true);
}
function clearAll(){document.getElementById('results').innerHTML='';}

async function calcAndShow(dateStr,append){
  var area=document.getElementById('results');
  var placeholder=document.createElement('div');
  placeholder.className='result-card';
  placeholder.innerHTML='<div class="card-header"><div class="title">&#x23F3; מחשב...</div></div><div class="card-body"><div class="loading">שולח שאילתות ל-Hebcal...</div></div>';
  if(append) area.appendChild(placeholder);
  else{area.innerHTML='';area.appendChild(placeholder);}
  try{
    var today=new Date(); today.setHours(0,0,0,0);
    var queryDateStr=document.getElementById('queryDateInput').value;
    var queryDate=queryDateStr?new Date(queryDateStr):new Date(today);
    queryDate.setHours(0,0,0,0);
    var isCustomQuery=!!queryDateStr;

    var bd=new Date(dateStr); bd.setHours(0,0,0,0);
    var hb=await gregToHeb(bd);
    if(!hb||hb.error) throw new Error('לא ניתן להמיר תאריך לידה');
    var birthHD=hb.hd,birthHM=hb.hm,birthHY_orig=hb.hy;
    if(birthHM==='Shvat') birthHM="Sh'vat";
    var birthHebStr=gem(birthHD)+' '+hmn(birthHM)+' '+hYearStr(birthHY_orig);

    var age=queryDate.getFullYear()-bd.getFullYear();
    var mdf=queryDate.getMonth()-bd.getMonth(),ddf=queryDate.getDate()-bd.getDate();
    if(mdf<0||(mdf===0&&ddf<0)) age--;
    if(age<0) age=0;

    var refH=await gregToHeb(queryDate);
    var refHY=refH.hy;
    var bmt=normalizeBirthMonth(birthHM,refHY);
    var bdThisY=await hebToGreg(refHY,bmt,birthHD);
    var bdThisGreg=bdThisY&&bdThisY.gy?new Date(bdThisY.gy,bdThisY.gm-1,bdThisY.gd):null;
    var lastBY=bdThisGreg&&bdThisGreg<=queryDate?refHY:refHY-1;
    var nextBY=lastBY+1;

    var bml=normalizeBirthMonth(birthHM,lastBY);
    var lbHG=await hebToGreg(lastBY,bml,birthHD);
    var lbGreg=lbHG&&lbHG.gy?new Date(lbHG.gy,lbHG.gm-1,lbHG.gd):null;
    var lbGStr=lbGreg?lbGreg.toLocaleDateString('he-IL'):'--';
    var lbHStr=gem(birthHD)+' '+hmn(bml)+' '+hYearStr(lastBY);

    var bmn2=normalizeBirthMonth(birthHM,nextBY);
    var nbHG=await hebToGreg(nextBY,bmn2,birthHD);
    var nbGreg=nbHG&&nbHG.gy?new Date(nbHG.gy,nbHG.gm-1,nbHG.gd):null;
    var nbGStr=nbGreg?nbGreg.toLocaleDateString('he-IL'):'--';
    var nbHStr=gem(birthHD)+' '+hmn(bmn2)+' '+hYearStr(nextBY);

    var psalmAge=Math.min(age,149);
    var pd=PSALM_DATA[psalmAge];
    var studyMonths=buildStudyMonths(birthHM,birthHD,lastBY);
    var numM=studyMonths.length;
    var ranges=distributeVerses(pd.v,numM);
    var todayIdx=await findMonthIdx(studyMonths,today);
    var queryIdx=isCustomQuery?await findMonthIdx(studyMonths,queryDate):todayIdx;
    var activeIdx=isCustomQuery?queryIdx:todayIdx;

    var activeFmt=formatSegs(ranges[activeIdx]);
    var todayFmt=formatSegs(ranges[todayIdx]);

    // Extract numeric vFrom/vTo from active range (first segment)
    var activeSegs=ranges[activeIdx];
    var vFrom=activeSegs[0][0],vTo=activeSegs[activeSegs.length-1][1];
    var activeMonth=studyMonths[activeIdx];

    var tableRows='';
    for(var ti=0;ti<studyMonths.length;ti++){
      var sm2=studyMonths[ti],fmt=formatSegs(ranges[ti]);
      var rcHG2=await hebToGreg(sm2.hy,sm2.hm,1);
      var rcG2=rcHG2&&rcHG2.gy?new Date(rcHG2.gy,rcHG2.gm-1,rcHG2.gd):null;
      var rcGStr=rcG2?rcG2.toLocaleDateString('he-IL'):'--';
      var isActive=(ti===activeIdx);
      var segs2=ranges[ti];
      var vf2=segs2[0][0],vt2=segs2[segs2.length-1][1];
      var viewBtn='<button class="btn-view" onclick="showViewer('+pd.p+','+(ti+1)+','+numM+','+vf2+','+vt2+',\''+sm2.hmn+' '+hYearStr(sm2.hy)+'\',\''+fmt.display+'\')">&#x1F4D6; קרא</button>';
      tableRows+='<tr'+(isActive?' class="current-row"':'')+'>'+
        '<td>'+(ti+1)+'</td>'+
        '<td>'+sm2.hmn+' '+hYearStr(sm2.hy)+'</td>'+
        '<td style="direction:ltr">'+rcGStr+'</td>'+
        '<td>'+fmt.display+' <small style="color:#888">('+fmt.numeric+')</small></td>'+
        '<td>'+viewBtn+'</td>'+
        '</tr>';
    }

    var queryLabel=isCustomQuery?
      (' | שאילתה: '+queryDate.toLocaleDateString('he-IL')):'';

    var html=
      '<div class="card-header">'+
        '<div class="title">&#x2726; '+dateStr+' &nbsp;|&nbsp; '+birthHebStr+'</div>'+
        '<div class="badge">פרק '+pd.p+' | גיל '+age+'</div>'+
      '</div>'+
      '<div class="card-body">'+
        '<div class="info-grid">'+
          '<div class="info-item"><div class="lbl">תאריך לידה עברי</div><div class="val">'+birthHebStr+'</div></div>'+
          '<div class="info-item"><div class="lbl">גיל</div><div class="val">'+age+' שנים</div></div>'+
          '<div class="info-item"><div class="lbl">יום הולדת אחרון (עברי)</div><div class="val">'+lbHStr+'</div></div>'+
          '<div class="info-item"><div class="lbl">יום הולדת אחרון (לועזי)</div><div class="val" style="direction:ltr">'+lbGStr+'</div></div>'+
          '<div class="info-item"><div class="lbl">יום הולדת הבא (עברי)</div><div class="val">'+nbHStr+'</div></div>'+
          '<div class="info-item"><div class="lbl">יום הולדת הבא (לועזי)</div><div class="val" style="direction:ltr">'+nbGStr+'</div></div>'+
        '</div>'+
        '<div class="current-highlight">'+
          '<div class="ch-item"><div class="lbl">פרק תהילים</div><div class="val">'+pd.p+'</div><div class="sub">'+pd.v+' פסוקים</div></div>'+
          '<div class="ch-item"><div class="lbl">חלוקה</div><div class="val">'+numM+' חודשים</div><div class="sub">'+(numM===13?'שנה מעוברת':'שנה רגילה')+'</div></div>'+
          '<div class="ch-item"><div class="lbl">חלק נוכחי'+(isCustomQuery?' (שאילתה)':' (היום)')+'</div><div class="val">'+(activeIdx+1)+'/'+numM+'</div><div class="sub">'+(activeMonth?activeMonth.hmn:'')+'</div></div>'+
          '<div class="ch-item"><div class="lbl">פסוקים</div><div class="val">'+activeFmt.display+'</div><div class="sub">('+activeFmt.numeric+')</div>'+
            '<button class="btn-view" onclick="showViewer('+pd.p+','+(activeIdx+1)+','+numM+','+vFrom+','+vTo+',\''+(activeMonth?activeMonth.hmn+' '+hYearStr(activeMonth.hy):'')+'\',\''+activeFmt.display+'\')">&#x1F4D6; קרא עכשיו</button>'+
          '</div>'+
          (isCustomQuery?'<div class="ch-item"><div class="lbl">היום</div><div class="val">'+(todayIdx+1)+'/'+numM+'</div><div class="sub">'+todayFmt.display+'</div></div>':'')+
        '</div>'+
        '<div class="divider">&#x1F4C5; תקופת לימוד: ראש חודש '+
          (studyMonths.length?studyMonths[0].hmn+' '+hYearStr(studyMonths[0].hy):'')+
          ' &mdash;&mdash;&mdash; '+
          (studyMonths.length?studyMonths[studyMonths.length-1].hmn+' '+hYearStr(studyMonths[studyMonths.length-1].hy):'')+
        '</div>'+
        '<table><tr><th>חלק</th><th>חודש עברי</th><th>ראש חודש (לועזי)</th><th>פסוקים</th><th>צפייה</th></tr>'+
        tableRows+'</table></div>';

    placeholder.innerHTML=html;
  }catch(e){
    placeholder.innerHTML='<div class="card-header"><div class="title">שגיאה</div></div><div class="card-body"><div class="error-msg">'+e.message+'</div></div>';
    console.error(e);
  }
}

window.onload=async function(){
  await loadFromHash();
  await calculate();
};
</script>

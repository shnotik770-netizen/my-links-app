<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מחשבון תהילים אישיים</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f1e8;color:#1a1208;direction:rtl;padding:1rem}
h1{font-size:1.4rem;color:#1B3A5C;margin-bottom:1rem;text-align:center;border-bottom:2px solid #C9A84C;padding-bottom:.5rem}
.controls{background:white;border-radius:10px;padding:1rem;margin-bottom:1rem;display:flex;gap:.7rem;align-items:flex-end;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{font-size:.83rem;color:#555;display:block;margin-bottom:3px}
input[type=date],input[type=text]{padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:.9rem;min-width:150px;direction:ltr}
button{padding:9px 18px;background:#1B3A5C;color:white;border:none;border-radius:6px;cursor:pointer;font-size:.9rem;font-family:inherit}
button:hover{background:#2A5A8C}
.btn-add{background:#C9A84C;color:#1B3A5C;font-weight:700}
.btn-add:hover{background:#F0D98A}
.results-area{display:grid;gap:1rem}
.result-card{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card-header{background:#1B3A5C;color:white;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center}
.card-header .title{font-size:1rem;font-weight:600}
.card-header .badge{background:#C9A84C;color:#1B3A5C;padding:3px 10px;border-radius:12px;font-size:.78rem;font-weight:700}
.card-body{padding:1rem}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.6rem;margin-bottom:.9rem}
.info-item{background:#f8f5ed;border-radius:7px;padding:.55rem .8rem}
.info-item .lbl{font-size:.72rem;color:#888;margin-bottom:2px}
.info-item .val{font-size:.92rem;color:#1B3A5C;font-weight:600}
.current-highlight{background:linear-gradient(135deg,#1B3A5C,#2A5A8C);color:white;border-radius:8px;padding:.8rem 1rem;margin-bottom:.9rem;display:flex;gap:1.5rem;flex-wrap:wrap}
.current-highlight .ch-item .lbl{font-size:.72rem;color:rgba(255,255,255,.7);margin-bottom:2px}
.current-highlight .ch-item .val{font-size:1.2rem;font-weight:700;color:#F0D98A}
.current-highlight .ch-item .sub{font-size:.78rem;color:rgba(255,255,255,.8)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:#1B3A5C;color:white;padding:6px 8px;text-align:right}
td{padding:6px 8px;border-bottom:1px solid #eee;text-align:right}
tr.current-row{background:#FFF8E8;font-weight:700}
tr.current-row td{border-color:#C9A84C}
.arrow{color:#C9A84C;font-weight:900}
.loading{text-align:center;padding:2rem;color:#888;font-style:italic}
.error-msg{background:#fff0f0;border:1px solid #ffcccc;color:#cc0000;border-radius:7px;padding:.8rem;margin-bottom:.5rem}
.preset-dates{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.3rem}
.preset{background:#e8f0f8;border:1px solid #b0c8e0;color:#1B3A5C;padding:4px 10px;border-radius:12px;cursor:pointer;font-size:.78rem}
.preset:hover{background:#1B3A5C;color:white}
.divider{color:#C9A84C;font-size:.8rem;font-weight:600;padding:.3rem 0;border-bottom:1px solid #eee;margin-bottom:.5rem}
</style>
</head>
<body>
<h1>✦ מחשבון תהילים אישיים ✦</h1>

<div class="controls">
  <div>
    <label>תאריך לידה לועזי (YYYY-MM-DD)</label>
    <input type="date" id="dateInput" value="1995-04-26">
  </div>
  <div>
    <div class="preset-dates">
      <span class="preset" onclick="setDate('1995-04-26')">26/04/1995 (כו ניסן)</span>
      <span class="preset" onclick="setDate('1990-03-15')">15/03/1990</span>
      <span class="preset" onclick="setDate('1985-09-01')">01/09/1985</span>
      <span class="preset" onclick="setDate('2000-01-01')">01/01/2000</span>
      <span class="preset" onclick="setDate('1975-12-31')">31/12/1975</span>
      <span class="preset" onclick="setDate('2010-07-15')">15/07/2010</span>
    </div>
  </div>
  <div style="display:flex;gap:.5rem">
    <button class="btn-add" onclick="calculate()">חשב ←</button>
    <button onclick="addToList()">+ הוסף לרשימה</button>
    <button onclick="clearAll()" style="background:#888">נקה</button>
  </div>
</div>

<div id="results" class="results-area"></div>

<script>
// ===== טבלת תהילים לפי גיל (גיל → {פרק, מספר פסוקים}) =====
// מבוסס אך ורק על הטבלה הרשמית
var PSALM_DATA = [
  {p:1,v:6},{p:2,v:12},{p:3,v:8},{p:4,v:9},{p:5,v:13},

  {p:16,v:11},{p:17,v:15},{p:18,v:51},{p:19,v:15},{p:20,v:10},

  {p:46,v:12},{p:47,v:10},{p:48,v:15},{p:49,v:21},{p:50,v:23},
  {p:51,v:21},{p:52,v:9},{p:53,v:7},{p:54,v:9},{p:55,v:24},
  {p:56,v:14},{p:57,v:12},{p:58,v:12},{p:59,v:18},{p:60,v:14},
  {p:61,v:9},{p:62,v:13},{p:63,v:12},{p:64,v:11},{p:65,v:14},
  {p:66,v:20},{p:67,v:8},{p:68,v:36},{p:69,v:37},{p:70,v:6},
  {p:71,v:24},{p:72,v:20},{p:73,v:28},{p:74,v:23},{p:75,v:11},
  {p:76,v:13},{p:77,v:21},{p:78,v:72},{p:79,v:13},{p:80,v:20},
  {p:81,v:17},{p:82,v:8},{p:83,v:19},{p:84,v:13},{p:85,v:14},
  {p:86,v:17},{p:87,v:7},{p:88,v:19},{p:89,v:53},{p:90,v:17},
  {p:91,v:16},{p:92,v:16},{p:93,v:5},{p:94,v:23},{p:95,v:11},
  {p:96,v:13},{p:97,v:12},{p:98,v:9},{p:99,v:9},{p:100,v:5},
  {p:101,v:8},{p:102,v:29},{p:103,v:22},{p:104,v:35},{p:105,v:45},
  {p:106,v:48},{p:107,v:43},{p:108,v:14},{p:109,v:31},{p:110,v:7},
  {p:111,v:10},{p:112,v:10},{p:113,v:9},{p:114,v:8},{p:115,v:18},
  {p:116,v:19},{p:117,v:2},{p:118,v:29},{p:119,v:176},{p:120,v:7},
  {p:121,v:8},{p:122,v:9},{p:123,v:4},{p:124,v:8},{p:125,v:5},
  {p:126,v:6},{p:127,v:5},{p:128,v:6},{p:129,v:8},{p:130,v:8},
  {p:131,v:3},{p:132,v:18},{p:133,v:3},{p:134,v:3},{p:135,v:21},
  {p:136,v:26},{p:137,v:9},{p:138,v:8},{p:139,v:24},{p:140,v:14},
  {p:141,v:10},{p:142,v:8},{p:143,v:12},{p:144,v:15},{p:145,v:21},
  {p:146,v:10},{p:147,v:20},{p:148,v:14},{p:149,v:9},{p:150,v:6}
];

// ===== גימטריה =====
var GEMATRIA={1:'א׳',2:'ב׳',3:'ג׳',4:'ד׳',5:'ה׳',6:'ו׳',7:'ז׳',8:'ח׳',9:'ט׳',10:'י׳',
  11:'י״א',12:'י״ב',13:'י״ג',14:'י״ד',15:'ט״ו',16:'ט״ז',17:'י״ז',18:'י״ח',19:'י״ט',20:'כ׳',
  21:'כ״א',22:'כ״ב',23:'כ״ג',24:'כ״ד',25:'כ״ה',26:'כ״ו',27:'כ״ז',28:'כ״ח',29:'כ״ט',30:'ל׳',
  31:'ל״א',32:'ל״ב',33:'ל״ג',34:'ל״ד',35:'ל״ה',36:'ל״ו',37:'ל״ז',38:'ל״ח',39:'ל״ט',40:'מ׳',
  50:'נ׳',60:'ס׳',70:'ע׳',80:'פ׳',90:'צ׳',100:'ק׳',110:'ק״י',120:'ק״כ',130:'ק״ל',140:'ק״מ',
  150:'ק״נ',160:'ק״ס',170:'ק״ע',176:'קע״ו'};
function gem(n){
  if(GEMATRIA[n]) return GEMATRIA[n];
  // build from parts for numbers not in table
  return String(n);
}

// ===== שמות חודשים =====
var HM={'Tishrei':'תשרי','Cheshvan':'חשון','Kislev':'כסלו','Tevet':'טבת','Shvat':'שבט',
  'Adar':'אדר','Adar I':'אדר א׳','Adar II':'אדר ב׳','Nisan':'ניסן','Iyar':'אייר',
  'Sivan':'סיון','Tamuz':'תמוז','Av':'אב','Elul':'אלול'};
var MR=['Tishrei','Cheshvan','Kislev','Tevet','Shvat','Adar','Nisan','Iyar','Sivan','Tamuz','Av','Elul'];
var ML=['Tishrei','Cheshvan','Kislev','Tevet','Shvat','Adar I','Adar II','Nisan','Iyar','Sivan','Tamuz','Av','Elul'];

function hmn(api){return HM[api]||api;}

// ===== שנה מעוברת =====
function isLeap(hy){return((7*hy+1)%19)<7;}

// ===== חלוקת פסוקים לחודשים (האלגוריתם המתוקן) =====
/**
 * V = מספר פסוקים, M = מספר חודשים
 * מחזיר מערך של M איברים, כל אחד [פסוק_התחלה, פסוק_סיום]
 */
function distributeVerses(V, M) {
  var result = [];
  if (V === M) {
    // מקרה א: שוויון מדויק
    for (var i = 1; i <= M; i++) {
      result.push([i, i]);
    }
  } else if (V < M) {
    // מקרה ב: פחות פסוקים מחודשים — סבב מחזורי
    for (var i = 0; i < M; i++) {
      var v = (i % V) + 1;
      result.push([v, v]);
    }
  } else {
    // מקרה ג: יותר פסוקים מחודשים — ceil(V/M) לכל חודש
    var n = Math.ceil(V / M);
    var cur = 1;
    for (var i = 0; i < M; i++) {
      var remainingMonths = M - i;
      var remainingVerses = V - cur + 1;
      if (remainingVerses <= remainingMonths) {
        // פסוק אחד לחודש עד הסוף
        result.push([cur, cur]);
        cur++;
      } else {
        var end = Math.min(cur + n - 1, V);
        result.push([cur, end]);
        cur = end + 1;
      }
    }
  }
  return result;
}

// ===== Hebcal API =====
var hcCache={};
async function gregToHeb(dateObj){
  var k='g'+dateObj.toISOString().split('T')[0];
  if(hcCache[k]) return hcCache[k];
  var y=dateObj.getFullYear(),m=dateObj.getMonth()+1,d=dateObj.getDate();
  var r=await fetch('https://www.hebcal.com/converter?v=1&cfg=json&gy='+y+'&gm='+m+'&gd='+d+'&g2h=1');
  var j=await r.json(); hcCache[k]=j; return j;
}
async function hebToGreg(hy,hm,hd){
  var k='h'+hy+'-'+hm+'-'+hd;
  if(hcCache[k]) return hcCache[k];
  var r=await fetch('https://www.hebcal.com/converter?v=1&cfg=json&hy='+hy+'&hm='+encodeURIComponent(hm)+'&hd='+hd+'&h2g=1');
  var j=await r.json();
  // handle error gracefully
  if(j.error) return null;
  hcCache[k]=j; return j;
}

// ===== נרמול חודש לידה לשנה נתונה =====
/**
 * מחזיר את שם ה-API של חודש הלידה בשנה העברית הנתונה.
 * מטפל בממירה בין אדר / אדר א׳ / אדר ב׳ בשנות עיבור/רגילות.
 * birthHM = שם חודש הלידה המקורי מ-Hebcal
 * forYear = שנה עברית לה רוצים להתאים
 */
function normalizeBirthMonth(birthHM, forYear) {
  var leap = isLeap(forYear);
  // ממירה בין שנה רגילה לשנה מעוברת
  if (!leap) {
    // שנה רגילה: אדר א׳ / אדר ב׳ → אדר
    if (birthHM === 'Adar I' || birthHM === 'Adar II') return 'Adar';
    return birthHM;
  } else {
    // שנה מעוברת: אדר → אדר ב׳ (המוסכמה הרווחת)
    if (birthHM === 'Adar') return 'Adar II';
    return birthHM;
  }
}

// ===== בניית חודשי לימוד =====
/**
 * מחזיר רשימה של 12 או 13 חודשים לפי השנה העברית שבה נפל יום ההולדת האחרון.
 * birthHM_api = שם חודש הלידה (כפי שמחזיר Hebcal)
 * lastBirthHY = שנה עברית של יום ההולדת האחרון
 */
function buildStudyMonths(birthHM_api, lastBirthHY) {
  var nextBirthHY = lastBirthHY + 1;

  // בנה רשימת חודשים: מחודש שאחרי חודש הלידה ועד (לא כולל) חודש הלידה בשנה הבאה
  // תמיד מתחיל מ-ראש חודש שאחרי חודש הלידה, מסתיים לפני ראש חודש הלידה הבא

  // שנה של יום ההולדת האחרון — אם מתחיל מ-Tishrei עלינו להיות בשנה הנכונה
  var months = [];

  // נמצא את הרשימה של lastBirthHY וחודש הלידה הנכון לשנה זו
  var lastLeap = isLeap(lastBirthHY);
  var lastList = lastLeap ? ML : MR;
  var birthMonthForLastYear = normalizeBirthMonth(birthHM_api, lastBirthHY);

  // נחפש את אינדקס חודש הלידה ברשימת חודשי השנה
  var birthIdx = lastList.indexOf(birthMonthForLastYear);
  if (birthIdx === -1) {
    // fallback
    birthIdx = lastList.indexOf('Nisan');
    if (birthIdx === -1) birthIdx = 0;
  }

  // נתחיל מהחודש שבא אחרי חודש הלידה
  var curY = lastBirthHY;
  var curList = lastList;
  var curIdx = birthIdx + 1;

  if (curIdx >= curList.length) {
    // עברנו לשנה הבאה
    curY = lastBirthHY + 1;
    curList = isLeap(curY) ? ML : MR;
    curIdx = 0;
  }

  // נוסיף חודשים עד שנגיע לחודש הלידה בשנה הבאה (lastBirthHY + 1)
  var birthMonthForNextYear = normalizeBirthMonth(birthHM_api, nextBirthHY);

  // נצבור לכל היותר 13 חודשים (מקסימום שנה מעוברת)
  for (var i = 0; i < 14; i++) {
    if (curIdx >= curList.length) {
      curY++;
      curList = isLeap(curY) ? ML : MR;
      curIdx = 0;
    }

    var hm = curList[curIdx];

    // האם הגענו לחודש הלידה בשנה הבאה? זה כבר לא בטווח הלימוד
    if (curY === nextBirthHY && hm === birthMonthForNextYear) break;
    // גם אם עברנו את השנה הבאה — נפסיק
    if (curY > nextBirthHY) break;

    months.push({ hy: curY, hm: hm, hmn: hmn(hm) });
    curIdx++;
  }

  // ולידציה: חייב להיות 12 או 13
  if (months.length < 12 || months.length > 13) {
    // שגיאה — נחזיר 12 חודשים כברירת מחדל
    console.warn('buildStudyMonths returned', months.length, 'months — expected 12 or 13');
  }

  return months;
}

// ===== מחשבון ראשי =====
async function calculate(){
  var inp=document.getElementById('dateInput').value;
  if(!inp){alert('הזן תאריך');return;}
  await calcAndShow(inp);
}

async function addToList(){
  var inp=document.getElementById('dateInput').value;
  if(!inp){alert('הזן תאריך');return;}
  await calcAndShow(inp,true);
}

function clearAll(){document.getElementById('results').innerHTML='';}
function setDate(d){document.getElementById('dateInput').value=d;}

async function calcAndShow(dateStr,append){
  var area=document.getElementById('results');
  var placeholder=document.createElement('div');
  placeholder.className='result-card';
  placeholder.innerHTML='<div class="card-header"><div class="title">⏳ מחשב עבור '+dateStr+'...</div></div><div class="card-body"><div class="loading">שולח שאילתות ל-Hebcal...</div></div>';
  if(append) area.appendChild(placeholder);
  else{area.innerHTML='';area.appendChild(placeholder);}

  try{
    var today=new Date(); today.setHours(0,0,0,0);

    // 1. המר תאריך לידה לעברי
    var bd=new Date(dateStr); bd.setHours(0,0,0,0);
    var hb=await gregToHeb(bd);
    if(!hb||hb.error) throw new Error('לא ניתן להמיר תאריך לידה: '+dateStr);
    var birthHD=hb.hd, birthHM=hb.hm, birthHY_orig=hb.hy;
    var birthHebStr=gem(birthHD)+' '+hmn(birthHM)+' '+birthHY_orig;

    // 2. גיל לועזי (לצורך הצגה בלבד)
    var age=today.getFullYear()-bd.getFullYear();
    var md=today.getMonth()-bd.getMonth(), dd2=today.getDate()-bd.getDate();
    if(md<0||(md===0&&dd2<0)) age--;
    if(age<0) age=0;

    // 3. מצא את יום ההולדת האחרון (עברי)
    //    — השנה העברית הנוכחית
    var todayH=await gregToHeb(today);
    var todayHY=todayH.hy;

    // נסה להמיר יום הולדת לשנה העברית הנוכחית
    var birthMonthThisYear = normalizeBirthMonth(birthHM, todayHY);
    var bdThisY = await hebToGreg(todayHY, birthMonthThisYear, birthHD);
    var bdThisGreg = (bdThisY && bdThisY.gy) ? new Date(bdThisY.gy, bdThisY.gm-1, bdThisY.gd) : null;

    // יום ההולדת האחרון: אם יום ההולדת בשנה הנוכחית כבר עבר (או היום) — זה האחרון
    var lastBY, nextBY;
    if(bdThisGreg && bdThisGreg<=today){
      lastBY=todayHY;
      nextBY=todayHY+1;
    } else {
      lastBY=todayHY-1;
      nextBY=todayHY;
    }

    // 4. המר יום הולדת אחרון לגרגוריאני לצורך הצגה
    var birthMonthLastYear = normalizeBirthMonth(birthHM, lastBY);
    var lbHG=await hebToGreg(lastBY, birthMonthLastYear, birthHD);
    var lbGreg=lbHG&&lbHG.gy?new Date(lbHG.gy,lbHG.gm-1,lbHG.gd):null;
    var lbGStr=lbGreg?lbGreg.toLocaleDateString('he-IL'):'—';
    var lbHStr=gem(birthHD)+' '+hmn(birthMonthLastYear)+' '+lastBY;

    // 5. המר יום הולדת הבא לגרגוריאני לצורך הצגה
    var birthMonthNextYear = normalizeBirthMonth(birthHM, nextBY);
    var nbHG=await hebToGreg(nextBY, birthMonthNextYear, birthHD);
    var nbGreg=nbHG&&nbHG.gy?new Date(nbHG.gy,nbHG.gm-1,nbHG.gd):null;
    var nbGStr=nbGreg?nbGreg.toLocaleDateString('he-IL'):'—';
    var nbHStr=gem(birthHD)+' '+hmn(birthMonthNextYear)+' '+nextBY;

    // 6. פרק תהילים לפי גיל
    var psalmAge=Math.min(age,149);
    var pd=PSALM_DATA[psalmAge];

    // 7. בנה חודשי לימוד (12 או 13)
    var studyMonths=buildStudyMonths(birthHM, lastBY);
    var numM=studyMonths.length;

    // 8. חלק את הפסוקים
    var ranges=distributeVerses(pd.v, numM);

    // 9. מצא את החלק הנוכחי
    var curIdx=0;
    for(var i=0;i<studyMonths.length;i++){
      var sm=studyMonths[i];
      var rcHG=await hebToGreg(sm.hy,sm.hm,1);
      var rcG=rcHG&&rcHG.gy?new Date(rcHG.gy,rcHG.gm-1,rcHG.gd):null;
      if(rcG&&rcG<=today) curIdx=i;
      else break;
    }

    var vR=ranges[curIdx]||[1,pd.v];

    // 10. בנה שורות טבלה
    var tableRows='';
    for(var ti=0;ti<studyMonths.length;ti++){
      var sm2=studyMonths[ti];
      var vR2=ranges[ti]||[1,pd.v];
      var rcHG2=await hebToGreg(sm2.hy,sm2.hm,1);
      var rcG2=rcHG2&&rcHG2.gy?new Date(rcHG2.gy,rcHG2.gm-1,rcHG2.gd):null;
      var rcGStr=rcG2?rcG2.toLocaleDateString('he-IL'):'—';
      var isCur=(ti===curIdx);
      var vStr=gem(vR2[0])+(vR2[0]===vR2[1]?'':'–'+gem(vR2[1]));
      var vNumStr=vR2[0]+(vR2[0]===vR2[1]?'':'–'+vR2[1]);
      tableRows+='<tr'+(isCur?' class="current-row"':'')+'>'\
        +'<td>'+(ti+1)+'</td>'\
        +'<td>'+sm2.hmn+' '+sm2.hy+'</td>'\
        +'<td style="direction:ltr">'+rcGStr+'</td>'\
        +'<td>'+vStr+' <small style="color:#888">('+vNumStr+')</small></td>'\
        +(isCur?'<td class="arrow">← עכשיו</td>':'<td></td>')\
        +'</tr>';
    }

    var curVStr=gem(vR[0])+(vR[0]===vR[1]?'':'–'+gem(vR[1]));
    var studyM=studyMonths;

    var html=`
      <div class="card-header">
        <div class="title">✦ ${dateStr} &nbsp;|&nbsp; ${birthHebStr}</div>
        <div class="badge">פרק ${pd.p} | גיל ${age}</div>
      </div>
      <div class="card-body">
        <div class="info-grid">
          <div class="info-item"><div class="lbl">תאריך לידה עברי (קבוע)</div><div class="val">${birthHebStr}</div></div>
          <div class="info-item"><div class="lbl">גיל</div><div class="val">${age} שנים</div></div>
          <div class="info-item"><div class="lbl">יום הולדת אחרון (עברי)</div><div class="val">${lbHStr}</div></div>
          <div class="info-item"><div class="lbl">יום הולדת אחרון (לועזי)</div><div class="val" style="direction:ltr">${lbGStr}</div></div>
          <div class="info-item"><div class="lbl">יום הולדת הבא (עברי)</div><div class="val">${nbHStr}</div></div>
          <div class="info-item"><div class="lbl">יום הולדת הבא (לועזי)</div><div class="val" style="direction:ltr">${nbGStr}</div></div>
        </div>

        <div class="current-highlight">
          <div class="ch-item"><div class="lbl">פרק תהילים</div><div class="val">${pd.p}</div><div class="sub">${pd.v} פסוקים</div></div>
          <div class="ch-item"><div class="lbl">חלוקה</div><div class="val">${numM} חודשים</div><div class="sub">${numM===13?'שנה מעוברת':'שנה רגילה'}</div></div>
          <div class="ch-item"><div class="lbl">חלק נוכחי</div><div class="val">${curIdx+1}/${numM}</div><div class="sub">${studyM[curIdx]?studyM[curIdx].hmn:''}</div></div>
          <div class="ch-item"><div class="lbl">פסוקים עכשיו</div><div class="val">${curVStr}</div><div class="sub">פס׳ ${vR[0]}${vR[0]===vR[1]?'':'–'+vR[1]}</div></div>
        </div>

        <div class="divider">📅 תקופת לימוד: ראש חודש ${studyM.length?studyM[0].hmn+' '+studyM[0].hy:''} ← ← ← ראש חודש ${studyM.length?studyM[studyM.length-1].hmn+' '+studyM[studyM.length-1].hy:''}</div>

        <table>
          <tr><th>חלק</th><th>חודש עברי</th><th>ראש חודש (לועזי)</th><th>פסוקים</th><th></th></tr>
          ${tableRows}
        </table>
      </div>`;

    placeholder.innerHTML=html;
  } catch(e){
    placeholder.innerHTML='<div class="card-header"><div class="title">שגיאה</div></div><div class="card-body"><div class="error-msg">'+e.message+'</div></div>';
    console.error(e);
  }
}

// הרץ אוטומטית בטעינה
window.onload=()=>calculate();
</script>
</body>
</html>

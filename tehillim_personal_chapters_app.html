// ===== גימטריה מלאה =====
function gem(n){
  if(n<=0) return String(n);
  var ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  var tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  var hundreds=['','ק','ר','ש','ת'];
  var result='';
  var rem=n;
  var h=Math.floor(rem/100);
  if(h>=5){result+='\u05ea';rem-=400;h=Math.floor(rem/100);}
  if(h>0){result+=hundreds[h];rem-=h*100;}
  if(rem===15){result+='\u05d8\u05d5';rem=0;}
  else if(rem===16){result+='\u05d8\u05d6';rem=0;}
  else{
    var t=Math.floor(rem/10);
    if(t>0){result+=tens[t];rem-=t*10;}
    if(rem>0){result+=ones[rem];}
  }
  if(result.length===1) return result+'\u05f3';
  return result.slice(0,-1)+'\u05f4'+result.slice(-1);
}

// ===== שנה עברית לאותיות (ללא אלפים) =====
function hYearStr(hy){return gem(hy%1000);}

// ===== שמות חודשים — כולל Sh'vat =====
var HM={
  'Tishrei':'\u05ea\u05e9\u05e8\u05d9',
  'Cheshvan':'\u05d7\u05e9\u05d5\u05df',
  'Kislev':'\u05db\u05e1\u05dc\u05d5',
  'Tevet':'\u05d8\u05d1\u05ea',
  'Shvat':'\u05e9\u05d1\u05d8',
  "Sh'vat":'\u05e9\u05d1\u05d8',
  'Adar':'\u05d0\u05d3\u05e8',
  'Adar I':'\u05d0\u05d3\u05e8 \u05d0\u05f3',
  'Adar II':'\u05d0\u05d3\u05e8 \u05d1\u05f3',
  'Nisan':'\u05e0\u05d9\u05e1\u05df',
  'Iyar':'\u05d0\u05d9\u05d9\u05e8',
  'Sivan':'\u05e1\u05d9\u05d5\u05df',
  'Tamuz':'\u05ea\u05de\u05d5\u05d6',
  'Av':'\u05d0\u05d1',
  'Elul':'\u05d0\u05dc\u05d5\u05dc'
};
// רשימות חודשים — Sh'vat בשתי הצורות
var MR=['Tishrei','Cheshvan','Kislev','Tevet',"Sh'vat",'Adar','Nisan','Iyar','Sivan','Tamuz','Av','Elul'];
var ML=['Tishrei','Cheshvan','Kislev','Tevet',"Sh'vat",'Adar I','Adar II','Nisan','Iyar','Sivan','Tamuz','Av','Elul'];
function hmn(api){return HM[api]||api;}
function isLeap(hy){return((7*hy+1)%19)<7;}

// ===== כלל א: נרמול חודש לידה לשנה נתונה =====
function normalizeBirthMonth(birthHM, forYear){
  var leap=isLeap(forYear);
  // תמיד נרמל Shvat -> Sh'vat
  if(birthHM==='Shvat') birthHM="Sh'vat";
  if(!leap){
    // שנה רגילה: אדר א / אדר ב -> אדר
    if(birthHM==='Adar I'||birthHM==='Adar II') return 'Adar';
    return birthHM;
  } else {
    // שנה מעוברת: אדר -> אדר ב
    if(birthHM==='Adar') return 'Adar II';
    return birthHM;
  }
}

// ===== כלל ב+ג: בניית חודשי לימוד בספירה ממשית =====
// תקופה: מהחודש שאחרי חודש הלידה ב-lastBY
//         עד וכולל חודש הלידה ב-nextBY
// חריג: אם יום הולדת הוא א' בחודש — חודש הלידה ב-nextBY לא נכלל
function buildStudyMonths(birthHM_api, birthHD, lastBirthHY){
  var nextBirthHY=lastBirthHY+1;
  var birthdayIsRoshChodesh=(birthHD===1);

  // חודש הלידה בכל שנה
  var bmLast=normalizeBirthMonth(birthHM_api, lastBirthHY);
  var bmNext=normalizeBirthMonth(birthHM_api, nextBirthHY);

  // התחל מהחודש שאחרי חודש הלידה ב-lastBY
  var curY=lastBirthHY;
  var curList=isLeap(curY)?ML:MR;
  var startIdx=curList.indexOf(bmLast);
  if(startIdx===-1) startIdx=0;
  var curIdx=startIdx+1;
  if(curIdx>=curList.length){curY++;curList=isLeap(curY)?ML:MR;curIdx=0;}

  var months=[];
  // מקסימום 13 איטרציות
  for(var i=0;i<13;i++){
    if(curIdx>=curList.length){curY++;curList=isLeap(curY)?ML:MR;curIdx=0;}
    var hm=curList[curIdx];

    if(curY===nextBirthHY && hm===bmNext){
      // הגענו לחודש הלידה ב-nextBY
      if(!birthdayIsRoshChodesh){
        // כולל את חודש הלידה
        months.push({hy:curY,hm:hm,hmn:hmn(hm)});
      }
      break;
    }
    // אם עברנו את nextBirthHY — עצור
    if(curY>nextBirthHY) break;

    months.push({hy:curY,hm:hm,hmn:hmn(hm)});
    curIdx++;
  }
  return months;
}

// ===== חלוקת פסוקים =====
function distributeVerses(V,M){
  var mult=1;
  while(V*mult<M) mult++;
  var totalV=V*mult;
  var base=Math.floor(totalV/M);
  var remainder=totalV%M;
  var result=[];
  var cur=0;
  for(var i=0;i<M;i++){
    var count=(i<remainder)?(base+1):base;
    var segs=[];
    var left=count;
    var pos=cur;
    while(left>0){
      var space=V-pos;
      var take=Math.min(left,space);
      segs.push([pos+1,pos+take]);
      pos=(pos+take)%V;
      left-=take;
    }
    result.push(segs);
    cur=(cur+count)%V;
  }
  return result;
}

function formatSegs(segs){
  var disp=[],num=[];
  for(var i=0;i<segs.length;i++){
    var s=segs[i];
    disp.push(s[0]===s[1]?gem(s[0]):gem(s[0])+'\u2013'+gem(s[1]));
    num.push(s[0]===s[1]?String(s[0]):s[0]+'-'+s[1]);
  }
  return {display:disp.join(', '),numeric:num.join(', ')};
}

// ===== Hebcal API =====
var hcCache={};
async function gregToHeb(dateObj){
  var k='g'+dateObj.toISOString().split('T')[0];
  if(hcCache[k]) return hcCache[k];
  var y=dateObj.getFullYear(),m=dateObj.getMonth()+1,d=dateObj.getDate();
  var r=await fetch('https://www.hebcal.com/converter?v=1&cfg=json&gy='+y+'&gm='+m+'&gd='+d+'&g2h=1');
  var j=await r.json(); hcCache[k]=j; return j;
}
async function hebToGreg(hy,hm,hd){
  var k='h'+hy+'-'+hm+'-'+hd;
  if(hcCache[k]) return hcCache[k];
  var r=await fetch('https://www.hebcal.com/converter?v=1&cfg=json&hy='+hy+'&hm='+encodeURIComponent(hm)+'&hd='+hd+'&h2g=1');
  var j=await r.json();
  if(j.error) return null;
  hcCache[k]=j; return j;
}

async function findMonthIdx(studyMonths,refDate){
  var idx=0;
  for(var i=0;i<studyMonths.length;i++){
    var rcHG=await hebToGreg(studyMonths[i].hy,studyMonths[i].hm,1);
    var rcG=rcHG&&rcHG.gy?new Date(rcHG.gy,rcHG.gm-1,rcHG.gd):null;
    if(rcG&&rcG<=refDate) idx=i;
    else break;
  }
  return idx;
}

async function calculate(){
  var inp=document.getElementById('dateInput').value;
  if(!inp){alert('הזן תאריך לידה');return;}
  await calcAndShow(inp,false);
}
async function addToList(){
  var inp=document.getElementById('dateInput').value;
  if(!inp){alert('הזן תאריך לידה');return;}
  await calcAndShow(inp,true);
}
function clearAll(){document.getElementById('results').innerHTML='';}
function setDate(d){document.getElementById('dateInput').value=d;}

async function calcAndShow(dateStr,append){
  var area=document.getElementById('results');
  var placeholder=document.createElement('div');
  placeholder.className='result-card';
  placeholder.innerHTML='<div class="card-header"><div class="title">&#x23F3; מחשב...</div></div><div class="card-body"><div class="loading">שולח שאילתות ל-Hebcal...</div></div>';
  if(append) area.appendChild(placeholder);
  else{area.innerHTML='';area.appendChild(placeholder);}

  try{
    var today=new Date(); today.setHours(0,0,0,0);
    var queryDateStr=document.getElementById('queryDateInput').value;
    var queryDate=queryDateStr?new Date(queryDateStr):new Date(today);
    queryDate.setHours(0,0,0,0);
    var isCustomQuery=!!queryDateStr;

    // תאריך לידה עברי
    var bd=new Date(dateStr); bd.setHours(0,0,0,0);
    var hb=await gregToHeb(bd);
    if(!hb||hb.error) throw new Error('לא ניתן להמיר תאריך לידה');
    var birthHD=hb.hd, birthHM=hb.hm, birthHY_orig=hb.hy;
    // נרמל Shvat
    if(birthHM==='Shvat') birthHM="Sh'vat";
    var birthHebStr=gem(birthHD)+' '+hmn(birthHM)+' '+hYearStr(birthHY_orig);

    // גיל לפי תאריך השאילתה
    var age=queryDate.getFullYear()-bd.getFullYear();
    var mdf=queryDate.getMonth()-bd.getMonth(),ddf=queryDate.getDate()-bd.getDate();
    if(mdf<0||(mdf===0&&ddf<0)) age--;
    if(age<0) age=0;

    // יום הולדת אחרון ביחס לתאריך השאילתה
    var refH=await gregToHeb(queryDate);
    var refHY=refH.hy;
    var bmt=normalizeBirthMonth(birthHM,refHY);
    var bdThisY=await hebToGreg(refHY,bmt,birthHD);
    var bdThisGreg=bdThisY&&bdThisY.gy?new Date(bdThisY.gy,bdThisY.gm-1,bdThisY.gd):null;
    var lastBY=bdThisGreg&&bdThisGreg<=queryDate?refHY:refHY-1;
    var nextBY=lastBY+1;

    // תאריכי יו"ב להצגה
    var bml=normalizeBirthMonth(birthHM,lastBY);
    var lbHG=await hebToGreg(lastBY,bml,birthHD);
    var lbGreg=lbHG&&lbHG.gy?new Date(lbHG.gy,lbHG.gm-1,lbHG.gd):null;
    var lbGStr=lbGreg?lbGreg.toLocaleDateString('he-IL'):'--';
    var lbHStr=gem(birthHD)+' '+hmn(bml)+' '+hYearStr(lastBY);

    var bmn2=normalizeBirthMonth(birthHM,nextBY);
    var nbHG=await hebToGreg(nextBY,bmn2,birthHD);
    var nbGreg=nbHG&&nbHG.gy?new Date(nbHG.gy,nbHG.gm-1,nbHG.gd):null;
    var nbGStr=nbGreg?nbGreg.toLocaleDateString('he-IL'):'--';
    var nbHStr=gem(birthHD)+' '+hmn(bmn2)+' '+hYearStr(nextBY);

    var psalmAge=Math.min(age,149);
    var pd=PSALM_DATA[psalmAge];

    // בנה חודשי לימוד — ספירה ממשית
    var studyMonths=buildStudyMonths(birthHM,birthHD,lastBY);
    var numM=studyMonths.length;
    var ranges=distributeVerses(pd.v,numM);

    var todayIdx=await findMonthIdx(studyMonths,today);
    var queryIdx=isCustomQuery?await findMonthIdx(studyMonths,queryDate):todayIdx;

    var todayFmt=formatSegs(ranges[todayIdx]);
    var queryFmt=formatSegs(ranges[queryIdx]);

    var tableRows='';
    for(var ti=0;ti<studyMonths.length;ti++){
      var sm2=studyMonths[ti];
      var fmt=formatSegs(ranges[ti]);
      var rcHG2=await hebToGreg(sm2.hy,sm2.hm,1);
      var rcG2=rcHG2&&rcHG2.gy?new Date(rcHG2.gy,rcHG2.gm-1,rcHG2.gd):null;
      var rcGStr=rcG2?rcG2.toLocaleDateString('he-IL'):'--';
      var isTodayRow=(ti===todayIdx);
      var isQueryRow=isCustomQuery&&(ti===queryIdx)&&(queryIdx!==todayIdx);
      var rowClass=isQueryRow?'query-row':(isTodayRow?'current-row':'');
      var arrowCell='<td></td>';
      if(isQueryRow) arrowCell='<td class="arrow-query">\u2190 שאילתה</td>';
      else if(isTodayRow) arrowCell='<td class="arrow">\u2190 היום</td>';
      tableRows+='<tr'+(rowClass?' class="'+rowClass+'"':'')+'>'+
        '<td>'+(ti+1)+'</td>'+
        '<td>'+sm2.hmn+' '+hYearStr(sm2.hy)+'</td>'+
        '<td style="direction:ltr">'+rcGStr+'</td>'+
        '<td>'+fmt.display+' <small style="color:#888">('+fmt.numeric+')</small></td>'+
        arrowCell+'</tr>';
    }

    var queryBlock='';
    if(isCustomQuery&&queryIdx!==todayIdx){
      queryBlock='<div class="query-highlight">'+
        '<div class="ch-item"><div class="lbl">&#x1F4C5; שאילתה: '+queryDate.toLocaleDateString('he-IL')+'</div>'+
        '<div class="val">'+(queryIdx+1)+'/'+numM+'</div>'+
        '<div class="sub">'+(studyMonths[queryIdx]?studyMonths[queryIdx].hmn:'')+'</div></div>'+
        '<div class="ch-item"><div class="lbl">פסוקים בתאריך השאילתה</div>'+
        '<div class="val">'+queryFmt.display+'</div>'+
        '<div class="sub">('+queryFmt.numeric+')</div></div></div>';
    }

    var html=
      '<div class="card-header">'+
        '<div class="title">&#x2726; '+dateStr+' &nbsp;|&nbsp; '+birthHebStr+'</div>'+
        '<div class="badge">פרק '+pd.p+' | גיל '+age+'</div>'+
      '</div>'+
      '<div class="card-body">'+
        '<div class="info-grid">'+
          '<div class="info-item"><div class="lbl">תאריך לידה עברי (קבוע)</div><div class="val">'+birthHebStr+'</div></div>'+
          '<div class="info-item"><div class="lbl">גיל</div><div class="val">'+age+' שנים</div></div>'+
          '<div class="info-item"><div class="lbl">יום הולדת אחרון (עברי)</div><div class="val">'+lbHStr+'</div></div>'+
          '<div class="info-item"><div class="lbl">יום הולדת אחרון (לועזי)</div><div class="val" style="direction:ltr">'+lbGStr+'</div></div>'+
          '<div class="info-item"><div class="lbl">יום הולדת הבא (עברי)</div><div class="val">'+nbHStr+'</div></div>'+
          '<div class="info-item"><div class="lbl">יום הולדת הבא (לועזי)</div><div class="val" style="direction:ltr">'+nbGStr+'</div></div>'+
        '</div>'+
        '<div class="current-highlight">'+
          '<div class="ch-item"><div class="lbl">פרק תהילים</div><div class="val">'+pd.p+'</div><div class="sub">'+pd.v+' פסוקים</div></div>'+
          '<div class="ch-item"><div class="lbl">חלוקה</div><div class="val">'+numM+' חודשים</div><div class="sub">'+(numM===13?'שנה מעוברת':'שנה רגילה')+'</div></div>'+
          '<div class="ch-item"><div class="lbl">חלק נוכחי (היום)</div><div class="val">'+(todayIdx+1)+'/'+numM+'</div><div class="sub">'+(studyMonths[todayIdx]?studyMonths[todayIdx].hmn:'')+'</div></div>'+
          '<div class="ch-item"><div class="lbl">פסוקים עכשיו</div><div class="val">'+todayFmt.display+'</div><div class="sub">('+todayFmt.numeric+')</div></div>'+
        '</div>'+
        queryBlock+
        '<div class="divider">&#x1F4C5; תקופת לימוד: ראש חודש '+
          (studyMonths.length?studyMonths[0].hmn+' '+hYearStr(studyMonths[0].hy):'')+
          ' &mdash;&mdash;&mdash; '+
          (studyMonths.length?studyMonths[studyMonths.length-1].hmn+' '+hYearStr(studyMonths[studyMonths.length-1].hy):'')+
        '</div>'+
        '<table><tr><th>חלק</th><th>חודש עברי</th><th>ראש חודש (לועזי)</th><th>פסוקים</th><th></th></tr>'+
        tableRows+'</table></div>';

    placeholder.innerHTML=html;
  } catch(e){
    placeholder.innerHTML='<div class="card-header"><div class="title">שגיאה</div></div><div class="card-body"><div class="error-msg">'+e.message+'</div></div>';
    console.error(e);
  }
}

window.onload=function(){calculate();};
</script>
</body>
</html>

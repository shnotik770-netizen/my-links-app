<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 מבצע חברתי</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7C3AED;
    --pink: #EC4899;
    --amber: #F59E0B;
    --green: #10B981;
    --blue: #3B82F6;
    --red: #EF4444;
    --card: rgba(255,255,255,0.97);
    --radius: 18px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Heebo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    direction: rtl;
    padding-bottom: 48px;
  }
  .blob-bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.22; animation: blobFloat 9s ease-in-out infinite; }
  .blob-1 { width: 420px; height: 420px; background: #f093fb; top: -120px; right: -100px; animation-delay: 0s; }
  .blob-2 { width: 320px; height: 320px; background: #4facfe; bottom: -60px; left: -60px; animation-delay: 3s; }
  .blob-3 { width: 260px; height: 260px; background: #f5af19; top: 42%; left: 28%; animation-delay: 6s; }
  @keyframes blobFloat { 0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(18px,-18px) scale(1.06);} }

  .container { max-width: 540px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 1; }

  /* Header */
  .header {
    background: rgba(255,255,255,0.16);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,0.24);
    padding: 14px 16px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-inner { max-width: 540px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-family: 'Fredoka One', cursive; color: #fff; font-size: 23px; }
  .header-sub { color: rgba(255,255,255,0.82); font-size: 12px; margin-top: 1px; }
  .header-score { background: rgba(255,255,255,0.2); border-radius: 14px; padding: 7px 16px; text-align: center; border: 1px solid rgba(255,255,255,0.3); }
  .header-score-num { color: #FFD700; font-weight: 800; font-size: 28px; line-height: 1; font-family: 'Fredoka One', cursive; }
  .header-score-label { color: #fff; font-size: 11px; }

  .heb-date-banner {
    background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.28);
    border-radius: 11px; padding: 7px 14px; margin: 10px 0 0;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .heb-date-text { color: #fff; font-size: 14px; font-weight: 700; }
  .heb-date-greg { color: rgba(255,255,255,0.72); font-size: 12px; }

  .motivation {
    background: var(--card); border-radius: var(--radius); padding: 13px 18px;
    margin: 14px 0 10px; text-align: center;
    box-shadow: 0 8px 32px rgba(124,58,237,0.14);
    animation: slideDown 0.45s ease;
  }
  .motivation p { font-size: 15px; font-weight: 700; color: var(--purple); }
  @keyframes slideDown { from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);} }

  .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1; padding: 10px 4px; border-radius: 13px; border: none;
    font-family: 'Heebo', sans-serif; font-weight: 700; font-size: 13px;
    cursor: pointer; transition: all 0.2s;
    background: rgba(255,255,255,0.27); color: #fff;
  }
  .tab-btn.active { background: #fff; color: var(--purple); box-shadow: 0 4px 16px rgba(0,0,0,0.17); transform: translateY(-1px); }

  .card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    margin-bottom: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    animation: fadeUp 0.35s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);} }
  .card h3 { font-size: 15px; color: #1F2937; margin-bottom: 12px; font-weight: 700; }

  select, input[type=text] {
    width: 100%; padding: 11px 14px;
    border-radius: 11px; border: 1.5px solid #E5E7EB;
    font-family: 'Heebo', sans-serif; font-size: 14px;
    background: #F9FAFB; color: #1F2937; outline: none; transition: border-color 0.2s;
  }
  select:focus, input[type=text]:focus { border-color: var(--purple); background: #fff; }

  .kids-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .kid-btn {
    padding: 8px 16px; border-radius: 22px; border: 2px solid #E5E7EB;
    background: #F9FAFB; color: #374151;
    font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.18s;
  }
  .kid-btn:hover { border-color: var(--purple); }
  .kid-btn.selected { border-color: var(--purple); background: var(--purple); color: #fff; transform: scale(1.05); }

  .add-kid-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-kid-row input { flex: 1; }
  .btn-add {
    padding: 11px 18px; background: var(--green); color: #fff;
    border: none; border-radius: 11px; font-size: 22px; cursor: pointer; transition: transform 0.15s;
  }
  .btn-add:hover { transform: scale(1.1); }

  .btn-save {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff; border: none; border-radius: 14px;
    font-family: 'Fredoka One', cursive; font-size: 18px; letter-spacing: 0.5px;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(124,58,237,0.35);
  }
  .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,58,237,0.45); }
  .btn-save:disabled { background: #9CA3AF; box-shadow: none; cursor: not-allowed; transform: none; }

  .alert { border-radius: 11px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
  .alert-error   { background: #FEF2F2; color: #DC2626; border: 1px solid #FCA5A5; }
  .alert-success { background: #F0FDF4; color: #16A34A; border: 1px solid #86EFAC; }
  .alert-info    { background: #EFF6FF; color: #1D4ED8; border: 1px solid #93C5FD; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-card { background: var(--card); border-radius: 16px; padding: 14px 8px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .stat-icon { font-size: 24px; margin-bottom: 3px; }
  .stat-num { font-family: 'Fredoka One', cursive; font-size: 28px; color: #1F2937; line-height: 1; }
  .stat-label { font-size: 11px; color: #6B7280; margin-top: 2px; }

  .week-block { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .week-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .week-title { font-weight: 700; color: #1F2937; font-size: 14px; }
  .week-sub { font-size: 12px; color: #6B7280; margin-top: 2px; }
  .week-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .week-badge.great { background: #D1FAE5; color: #065F46; }
  .week-badge.good  { background: #FEF3C7; color: #92400E; }
  .week-badge.low   { background: #FEE2E2; color: #991B1B; }

  .week-days { display: flex; gap: 6px; justify-content: flex-start; flex-wrap: wrap; }
  .day-dot {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; cursor: default;
  }
  .day-dot.done   { background: var(--purple); color: #fff; }
  .day-dot.miss   { background: #F3F4F6; color: #9CA3AF; border: 1.5px dashed #D1D5DB; }
  .day-dot.today  { background: var(--amber); color: #fff; }
  .day-dot.future { background: transparent; color: #D1D5DB; border: 1.5px dashed #E5E7EB; }

  .chart-wrap { position: relative; height: 200px; }

  .badges-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .badge-card {
    border-radius: 14px; padding: 14px 10px; text-align: center;
    border: 2px solid #E5E7EB; background: #F9FAFB; opacity: 0.44; transition: all 0.3s;
  }
  .badge-card.earned {
    background: linear-gradient(135deg, #FFF7ED, #FEF3C7);
    border-color: var(--amber); opacity: 1;
    box-shadow: 0 4px 16px rgba(245,158,11,0.18);
  }
  .badge-icon { font-size: 32px; margin-bottom: 5px; }
  .badge-label { font-weight: 700; font-size: 13px; color: #1F2937; }
  .badge-desc { font-size: 11px; color: #6B7280; margin-top: 3px; }
  .badge-earned-tag { color: #059669; font-weight: 700; font-size: 11px; margin-top: 5px; }

  .footer-btns { display: flex; gap: 8px; margin-top: 4px; }
  .btn-ghost {
    flex: 1; padding: 10px;
    background: rgba(255,255,255,0.22); color: #fff;
    border: 1px solid rgba(255,255,255,0.36); border-radius: 11px;
    font-family: 'Heebo', sans-serif; font-weight: 600; font-size: 13px;
    cursor: pointer; transition: background 0.2s;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.32); }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-left: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #loading-screen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; z-index: 999;
  }
  .load-icon { font-size: 60px; animation: bounce 0.85s ease infinite alternate; }
  @keyframes bounce { from{transform:translateY(0);}to{transform:translateY(-14px);} }
  #loading-screen p { color: #fff; font-size: 17px; font-weight: 700; font-family: 'Heebo', sans-serif; }
  #loading-screen small { color: rgba(255,255,255,0.7); font-size: 13px; font-family: 'Heebo', sans-serif; }

  .section-heading { color: #fff; font-size: 15px; font-weight: 700; margin: 14px 0 8px; }
</style>
</head>
<body>

<div id="loading-screen">
  <div class="load-icon">🎮</div>
  <p>טוען מבצע חברתי...</p>
  <small>מביא תאריכים עבריים מ-Hebcal...</small>
</div>

<div class="blob-bg">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="header">
  <div class="header-inner">
    <div>
      <div class="header-title">🎮 מבצע חברתי</div>
      <div class="header-sub">5 דקות, חבר חדש, כל יום!</div>
    </div>
    <div class="header-score">
      <div class="header-score-num" id="header-total">0</div>
      <div class="header-score-label">ימי הצלחה</div>
    </div>
  </div>
  <div class="container">
    <div class="heb-date-banner">
      <span>📅</span>
      <span class="heb-date-text" id="heb-date-today">טוען...</span>
      <span class="heb-date-greg" id="greg-date-today"></span>
    </div>
  </div>
</div>

<div class="container" style="margin-top:14px;">

  <div class="motivation"><p id="motivation-text">טוען...</p></div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('log')">📝 רישום</button>
    <button class="tab-btn" onclick="switchTab('stats')">📊 שבועי</button>
    <button class="tab-btn" onclick="switchTab('badges')">🏆 תגים</button>
  </div>

  <!-- LOG -->
  <div id="tab-log">
    <div class="card">
      <h3>📅 איזה יום?</h3>
      <select id="day-select" style="margin-bottom:16px;"></select>
      <h3>👦 עם מי שיחקת?</h3>
      <div class="kids-grid" id="kids-grid"></div>
      <div class="add-kid-row">
        <input type="text" id="new-kid-input" placeholder="הוסף ילד חדש...">
        <button class="btn-add" onclick="addKid()">+</button>
      </div>
      <div id="log-alert"></div>
      <button class="btn-save" id="save-btn" onclick="savePlay()">💾 שמור משחק! 🎮</button>
    </div>
  </div>

  <!-- STATS -->
  <div id="tab-stats" style="display:none;">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-icon">🏆</div><div class="stat-num" id="stat-total">0</div><div class="stat-label">סה"כ ימים</div></div>
      <div class="stat-card"><div class="stat-icon">🔥</div><div class="stat-num" id="stat-streak">0</div><div class="stat-label">ימים ברצף</div></div>
      <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-num" id="stat-kids">0</div><div class="stat-label">ילדים שונים</div></div>
    </div>
    <div id="week-this-container"></div>
    <div class="card">
      <h3>👫 משחקים לפי ילד (כל הזמנים)</h3>
      <div class="chart-wrap"><canvas id="kids-chart"></canvas></div>
    </div>
    <div id="past-weeks-container"></div>
  </div>

  <!-- BADGES -->
  <div id="tab-badges" style="display:none;">
    <div class="card">
      <h3 style="text-align:center;">🏆 תגי הישגים</h3>
      <div class="badges-grid" id="badges-grid"></div>
      <p style="text-align:center;color:#6B7280;font-size:12px;margin-top:14px;" id="badges-summary"></p>
    </div>
  </div>

  <div class="footer-btns">
    <button class="btn-ghost" onclick="refreshData()">🔄 רענן נתונים</button>
  </div>
</div>

<script>
// ══════════════════════════════════
// CONFIG — שנה כאן את ה-URL שלך
// ══════════════════════════════════
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxbex-8ZM8rN5I3D9ez-tweTtNlHG3ytAoQpr9lNG6xAwpuvM54_KOjVNNa2bNdxy9O/exec";

// ══════════════════════════════════
// MOTIVATIONS — לפי יום בשבוע
// ══════════════════════════════════
const MOTIVATIONS = {
  0: ["☀️ שבוע חדש! הגיע הזמן לפתוח אותו בחברות ובחיוך!","🚀 ראשון — יום מעולה להתחיל מחדש!"],
  1: ["💪 יום שני? אתה כבר בדרך הנכונה!","🌟 כל יום שני הוא דף חלק — כתוב עליו משחק מגניב!"],
  2: ["🎯 שלישי — אמצע השבוע, ואתה עוד כאן. כל הכבוד!","😊 חיוך אחד מדבק — פזר אותו היום!"],
  3: ["🌈 רביעי — כבר חצי שבוע של גבורה חברתית!","🤝 חברות אמיתית נבנית כל יום. אתה בונה משהו מיוחד!"],
  4: ["🎉 חמישי — עוד יום אחד ויש לך שבוע נהדר!","⭐ כל יום שאתה משחק — אתה כוכב של מישהו!"],
  5: ["🏆 שישי — סיים את השבוע בגדול!","🌺 שישי מדהים! עשית את השבוע הזה שווה!"],
  6: ["🌙 שבת שלום — שבוע חדש מגיע. אתה מוכן?","🦋 שבת — זמן לחשוב כמה חברים נגעת בליבם השבוע!"],
};

const BADGES = [
  {id:"start",   icon:"🌱", label:"יוצא לדרך",    desc:"משחק ראשון",             req:(p,k,s)=>p>=1},
  {id:"five",    icon:"🤝", label:"חבר מתמיד",    desc:"5 ימי הצלחה",            req:(p,k,s)=>p>=5},
  {id:"week1",   icon:"📅", label:"שבוע שלם",     desc:"7 ימי הצלחה",            req:(p,k,s)=>p>=7},
  {id:"streak3", icon:"🔥", label:"בוער!",         desc:"3 ימים ברצף",            req:(p,k,s)=>s>=3},
  {id:"diverse", icon:"🌍", label:"חובק עולם",     desc:"3 ילדים שונים",          req:(p,k,s)=>k>=3},
  {id:"streak7", icon:"⚡", label:"סופרמן!",       desc:"7 ימים ברצף",            req:(p,k,s)=>s>=7},
  {id:"social",  icon:"🎊", label:"נשמת הכיתה",   desc:"15 ימי הצלחה",           req:(p,k,s)=>p>=15},
  {id:"king",    icon:"👑", label:"מלך הכיתה",    desc:"5 ילדים שונים",          req:(p,k,s)=>k>=5},
  {id:"legend",  icon:"🏆", label:"אגדה!",         desc:"30 ימי הצלחה",           req:(p,k,s)=>p>=30},
  {id:"super",   icon:"🌟", label:"סופר-גיבור",   desc:"60 ימי הצלחה",           req:(p,k,s)=>p>=60},
];

const COLORS = ["#7C3AED","#EC4899","#F59E0B","#10B981","#3B82F6","#EF4444","#8B5CF6","#06B6D4","#84CC16","#F97316"];
const DAY_NAMES_SHORT = ["א׳","ב׳","ג׳","ד׳","ה׳","ו׳","ש׳"];

// ══════════════════════════════════
// STATE
// ══════════════════════════════════
let kids = [];
let plays = [];
let selectedKid = "";
let selectedDayIso = todayISO();
let hebDateCache = {};
let chartInstance = null;

// ══════════════════════════════════
// INIT
// ══════════════════════════════════
async function init() {
  const day = new Date().getDay();
  const arr = MOTIVATIONS[day] || MOTIVATIONS[0];
  document.getElementById("motivation-text").textContent = arr[Math.floor(Math.random() * arr.length)];
  document.getElementById("greg-date-today").textContent =
    new Date().toLocaleDateString("he-IL", {weekday:"long", day:"numeric", month:"long"});

  await Promise.all([
    fetchTodayHebDate(),
    buildDayDropdown(),
  ]);
  await refreshData();
  document.getElementById("loading-screen").style.display = "none";
}

// ══════════════════════════════════
// HEBCAL
// ══════════════════════════════════
async function fetchHebDateForISO(iso) {
  if (hebDateCache[iso]) return hebDateCache[iso];
  try {
    const [y,m,d] = iso.split("-");
    const url = `https://www.hebcal.com/converter?cfg=json&gy=${y}&gm=${+m}&gd=${+d}&g2h=1`;
    const res = await fetch(url);
    const data = await res.json();
    const heb = data.hebrew || iso;
    hebDateCache[iso] = heb;
    return heb;
  } catch {
    hebDateCache[iso] = iso;
    return iso;
  }
}

async function fetchTodayHebDate() {
  const heb = await fetchHebDateForISO(todayISO());
  document.getElementById("heb-date-today").textContent = heb;
}

// ══════════════════════════════════
// DAY DROPDOWN (14 days)
// ══════════════════════════════════
async function buildDayDropdown() {
  const isoList = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0,0,0,0);
    isoList.push(d.toISOString().split("T")[0]);
  }
  const hebDates = await Promise.all(isoList.map(iso => fetchHebDateForISO(iso)));
  const sel = document.getElementById("day-select");
  sel.innerHTML = "";
  isoList.forEach((iso, i) => {
    const d = new Date(iso + "T00:00:00");
    const label = i===0?"היום": i===1?"אתמול": d.toLocaleDateString("he-IL",{weekday:"long"});
    const opt = document.createElement("option");
    opt.value = iso;
    opt.textContent = `${label} — ${hebDates[i]}`;
    sel.appendChild(opt);
  });
  selectedDayIso = isoList[0];
  sel.onchange = () => { selectedDayIso = sel.value; };
}

// ══════════════════════════════════
// GOOGLE SHEETS
// ══════════════════════════════════
async function refreshData() {
  showAlert("log-alert","info","🔄 מתחבר לגוגל שיטס...");
  try {
    const [kRes, pRes] = await Promise.all([
      fetch(SHEET_URL + "?action=getKids"),
      fetch(SHEET_URL + "?action=getPlays"),
    ]);
    const kData = await kRes.json();
    const pData = await pRes.json();
    if (kData.kids) kids = kData.kids;
    if (pData.plays) plays = pData.plays;
    clearAlert("log-alert");
    renderKids();
    renderStats();
    renderBadges();
  } catch(e) {
    showAlert("log-alert","error","❌ שגיאה בחיבור. בדוק חיבור לאינטרנט ואת ה-URL.");
  }
}

async function savePlay() {
  if (!selectedKid) { showAlert("log-alert","error","⚠️ בחר ילד תחילה!"); return; }
  const btn = document.getElementById("save-btn");
  btn.disabled = true;
  btn.innerHTML = 'שומר... <span class="spinner"></span>';
  const iso = selectedDayIso;
  const heb = await fetchHebDateForISO(iso);
  try {
    await fetch(SHEET_URL, {
      method: "POST",
      body: JSON.stringify({action:"addPlay", date:iso, hebrewDate:heb, kidName:selectedKid, done:true})
    });
    showAlert("log-alert","success","🎉 נשמר בהצלחה! כל הכבוד!");
    await refreshData();
  } catch {
    showAlert("log-alert","error","❌ שגיאה בשמירה. נסה שוב.");
  }
  btn.disabled = false;
  btn.innerHTML = "💾 שמור משחק! 🎮";
}

async function addKid() {
  const input = document.getElementById("new-kid-input");
  const name = input.value.trim();
  if (!name) return;
  try {
    await fetch(SHEET_URL, {method:"POST", body:JSON.stringify({action:"addKid",name})});
    input.value = "";
    await refreshData();
  } catch {
    showAlert("log-alert","error","❌ שגיאה בהוספת ילד.");
  }
}

// RENDER KIDS
// ══════════════════════════════════
function renderKids() {
  const grid = document.getElementById("kids-grid");
  grid.innerHTML = "";
  kids.forEach(k => {
    const btn = document.createElement("button");
    btn.className = "kid-btn" + (selectedKid===k.name?" selected":"");
    btn.textContent = k.name;
    btn.onclick = () => { selectedKid = k.name; renderKids(); };
    grid.appendChild(btn);
  });
}

// ══════════════════════════════════
// STATS
// ══════════════════════════════════
function renderStats() {
  const done = plays.filter(p => p.done===true || p.done==="TRUE");
  const kidCounts = {};
  done.forEach(p => { kidCounts[p.kidName] = (kidCounts[p.kidName]||0)+1; });
  const uniqueKids = Object.keys(kidCounts).length;
  const totalDays = done.length;

  // Streak
  const sortedDates = [...new Set(done.map(p=>p.date))].sort().reverse();
  const today = new Date(); today.setHours(0,0,0,0);
  let streak = 0;
  for (let i=0; i<sortedDates.length; i++) {
    const d = new Date(sortedDates[i]+"T00:00:00"); d.setHours(0,0,0,0);
    const diff = Math.round((today-d)/86400000);
    if (diff===i || diff===i+1) streak++;
    else break;
  }

  document.getElementById("header-total").textContent = totalDays;
  document.getElementById("stat-total").textContent   = totalDays;
  document.getElementById("stat-streak").textContent  = streak;
  document.getElementById("stat-kids").textContent    = uniqueKids;

  renderKidsChart(kidCounts);
  renderWeeks(done);
}

function renderKidsChart(kidCounts) {
  const ctx = document.getElementById("kids-chart").getContext("2d");
  const labels = Object.keys(kidCounts);
  const data   = Object.values(kidCounts);
  if (chartInstance) chartInstance.destroy();
  if (!labels.length) return;
  chartInstance = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: COLORS.slice(0,labels.length),
        borderRadius: 8,
        borderSkipped: false,
      }]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false} },
      scales:{
        x:{ ticks:{font:{family:"Heebo",size:12}} },
        y:{ ticks:{stepSize:1, font:{family:"Heebo",size:12}}, beginAtZero:true }
      }
    }
  });
}

// ══════════════════════════════════
// WEEKLY VIEW
// ══════════════════════════════════
function isoFromDate(d) { return d.toISOString().split("T")[0]; }

function getWeekStart(dateOrIso) {
  const d = typeof dateOrIso==="string" ? new Date(dateOrIso+"T00:00:00") : new Date(dateOrIso);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay()); // Sunday = 0
  return d;
}

function renderWeeks(done) {
  const playsByDate = {};
  done.forEach(p => { playsByDate[p.date] = p; });

  const weekStartsSet = new Set();
  const today = new Date(); today.setHours(0,0,0,0);
  weekStartsSet.add(isoFromDate(getWeekStart(today)));
  done.forEach(p => {
    weekStartsSet.add(isoFromDate(getWeekStart(new Date(p.date+"T00:00:00"))));
  });
  const sorted = [...weekStartsSet].sort().reverse();

  // Current week
  const thisEl = document.getElementById("week-this-container");
  thisEl.innerHTML = "";
  if (sorted.length) thisEl.appendChild(buildWeekBlock(sorted[0], playsByDate, true));

  // Past weeks
  const pastEl = document.getElementById("past-weeks-container");
  pastEl.innerHTML = "";
  if (sorted.length > 1) {
    const h = document.createElement("div");
    h.className="section-heading"; h.textContent="📚 שבועות קודמים";
    pastEl.appendChild(h);
    sorted.slice(1).forEach(ws => pastEl.appendChild(buildWeekBlock(ws, playsByDate, false)));
  }
}

function buildWeekBlock(weekStartISO, playsByDate, isCurrent) {
  const ws = new Date(weekStartISO+"T00:00:00");
  const days = [];
  for (let i=0;i<7;i++) {
    const d = new Date(ws); d.setDate(d.getDate()+i); days.push(d);
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const we = days[6];

  const doneCount = days.filter(d => playsByDate[isoFromDate(d)]).length;
  const pastDays  = days.filter(d => d<=today).length;

  let badgeClass="low", badgeText="המשך לנסות 💪";
  if (doneCount >= 5)                          { badgeClass="great"; badgeText="שבוע מעולה! 🌟"; }
  else if (doneCount >= 3)                     { badgeClass="good";  badgeText="טוב מאוד! 👍"; }
  else if (isCurrent && pastDays < 3)          { badgeClass="good";  badgeText="בדרך הנכונה! 🚀"; }

  const wsLabel = ws.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});
  const weLabel = we.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});

  const block = document.createElement("div");
  block.className = "week-block";
  const uid = weekStartISO.replace(/-/g,"");
  block.innerHTML = `
    <div class="week-header">
      <div>
        <div class="week-title">${isCurrent?"📌 השבוע הנוכחי":"שבוע"} — ${wsLabel} עד ${weLabel}</div>
        <div class="week-sub">${doneCount} / ${isCurrent?pastDays:7} ימי הצלחה</div>
      </div>
      <span class="week-badge ${badgeClass}">${badgeText}</span>
    </div>
    <div class="week-days" id="wdays-${uid}"></div>
  `;

  requestAnimationFrame(() => {
    const container = document.getElementById(`wdays-${uid}`);
    if (!container) return;
    days.forEach(d => {
      const iso = isoFromDate(d);
      const isToday = isoFromDate(d)===isoFromDate(today);
      const isPast  = d<=today;
      const played  = !!playsByDate[iso];
      const dot = document.createElement("div");
      dot.className = "day-dot " + (!isPast?"future": played?"done": isToday?"today":"miss");
      dot.textContent = DAY_NAMES_SHORT[d.getDay()];
      dot.title = iso + (played?" ✓":"");
      container.appendChild(dot);
    });
  });
  return block;
}

// ══════════════════════════════════
// BADGES
// ══════════════════════════════════
function renderBadges() {
  const done = plays.filter(p=>p.done===true||p.done==="TRUE");
  const kidCounts={};
  done.forEach(p=>{kidCounts[p.kidName]=(kidCounts[p.kidName]||0)+1;});
  const uniqueKids=Object.keys(kidCounts).length, totalDays=done.length;
  const sortedDates=[...new Set(done.map(p=>p.date))].sort().reverse();
  const today=new Date();today.setHours(0,0,0,0);
  let streak=0;
  for(let i=0;i<sortedDates.length;i++){
    const d=new Date(sortedDates[i]+"T00:00:00");d.setHours(0,0,0,0);
    const diff=Math.round((today-d)/86400000);
    if(diff===i||diff===i+1)streak++;else break;
  }
  const grid=document.getElementById("badges-grid"); grid.innerHTML="";
  let earned=0;
  BADGES.forEach(b=>{
    const got=b.req(totalDays,uniqueKids,streak);
    if(got)earned++;
    const div=document.createElement("div");
    div.className="badge-card"+(got?" earned":"");
    div.innerHTML=`<div class="badge-icon">${b.icon}</div><div class="badge-label">${b.label}</div><div class="badge-desc">${b.desc}</div>${got?'<div class="badge-earned-tag">✓ הושג!</div>':""}`;
    grid.appendChild(div);
  });
  document.getElementById("badges-summary").textContent=`${earned} / ${BADGES.length} תגים הושגו`;
}

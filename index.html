<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדשבורד שלי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4a86e8; --success: #34a853; --bg: #f4f7f9; }
        body { font-family: 'Assistant', sans-serif; background: var(--bg); margin: 0; padding: 20px; text-align: center; }
        .hidden { display: none; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .link-card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.2s; position: relative; }
        .link-card.closed { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }
        .icon { font-size: 40px; margin-bottom: 10px; }
        .label { font-weight: bold; }
        .lock-msg { color: #d93025; font-size: 11px; margin-top: 8px; font-weight: bold; }
        
        /* Modal Styles */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; text-align: right; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-main { background: var(--primary); color: white; }
        .btn-request { background: var(--success); color: white; margin-top: 30px; }
    </style>
</head>
<body>

    <div id="app">
        <!-- מסך כניסה -->
        <div id="loginScreen">
            <h1>כניסה למערכת</h1>
            <input type="tel" id="pinInput" placeholder="הכנס קוד PIN" style="text-align:center; font-size:20px;">
            <button class="btn-main" onclick="login()">כניסה</button>
        </div>

        <!-- מסך ראשי -->
        <div id="mainScreen" class="hidden">
            <h2 id="welcomeHeader">שלום</h2>
            <div id="linksContainer" class="card-grid"></div>
            
            <button class="btn-request" onclick="openModal()">➕ בקשה לאתר חדש</button>
            <button onclick="logout()" style="background:none; color:#666; text-decoration:underline;">התנתק</button>
        </div>
    </div>

    <!-- מודאל בקשה -->
    <div id="requestModal" class="modal hidden">
        <div class="modal-content">
            <h3>בקשת אתר חדש</h3>
            <input type="text" id="reqName" placeholder="שם האתר">
            <input type="text" id="reqUrl" placeholder="כתובת (URL)">
            <input type="text" id="reqIcon" placeholder="אייקון (אימוג'י)">
            
            <label>ימי פעילות:</label>
            <div id="daysSelect" style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin:10px 0;">
                <label><input type="checkbox" value="ראשון" checked> ראשון</label>
                <label><input type="checkbox" value="שני" checked> שני</label>
                <label><input type="checkbox" value="שלישי" checked> שלישי</label>
                <label><input type="checkbox" value="רביעי" checked> רביעי</label>
                <label><input type="checkbox" value="חמישי" checked> חמישי</label>
                <label><input type="checkbox" value="שישי"> שישי</label>
            </div>

            <label>שעות פעילות:</label>
            <select id="reqHours">
                <option value="כל שעות היום">כל שעות היום</option>
                <option value="08:00-11:00">08:00-11:00</option>
                <option value="11:00-14:00">11:00-14:00</option>
                <option value="14:00-17:00">14:00-17:00</option>
                <option value="17:00-20:00">17:00-20:00</option>
                <option value="20:00-23:00">20:00-23:00</option>
            </select>

            <button class="btn-main" onclick="submitRequest()">שלח לאישור</button>
            <button onclick="closeModal()" style="background:#eee;">ביטול</button>
        </div>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbypo3Sbc2v8moe9t43u7t_-o0h_ON7um4gcFHESJc-NfHyo7YZRzFHLemV9q1KiCk1b/exec";

    window.onload = () => {
        const pin = localStorage.getItem('userPin');
        if (pin) loadData(pin);
    };

    function login() {
        const pin = document.getElementById('pinInput').value;
        if (pin) loadData(pin);
    }

    async function loadData(pin) {
        try {
            const res = await fetch(`${API_URL}?pin=${pin}`);
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('userPin', pin);
                renderLinks(data);
            } else { alert(data.message); }
        } catch (e) { alert("שגיאת תקשורת"); }
    }

    function renderLinks(data) {
        document.getElementById('welcomeHeader').innerText = "שלום, " + data.user;
        const container = document.getElementById('linksContainer');
        container.innerHTML = "";
        
        data.links.forEach(link => {
            const card = document.createElement('div');
            card.className = `link-card ${link.isOpen ? '' : 'closed'}`;
            if (link.isOpen) card.onclick = () => window.location.href = link.url;
            
            card.innerHTML = `
                <div class="icon">${link.icon || '🔗'}</div>
                <div class="label">${link.name}</div>
                ${!link.isOpen && link.openingTime ? `<div class="lock-msg">🔒 ייפתח ב-${link.openingTime}</div>` : ''}
            `;
            container.appendChild(card);
        });
        
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainScreen').classList.remove('hidden');
    }

    function openModal() { document.getElementById('requestModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('requestModal').classList.add('hidden'); }

    async function submitRequest() {
        const pin = localStorage.getItem('userPin');
        const days = Array.from(document.querySelectorAll('#daysSelect input:checked')).map(c => c.value);
        const body = {
            pin: pin,
            name: document.getElementById('reqName').value,
            url: document.getElementById('reqUrl').value,
            icon: document.getElementById('reqIcon').value,
            days: days,
            hours: document.getElementById('reqHours').value
        };

        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
        const result = await res.json();
        if (result.success) {
            alert("הבקשה נשלחה למנהל!");
            closeModal();
        }
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>

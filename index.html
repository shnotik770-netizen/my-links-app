<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הדשבורד שלי</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #4a86e8; 
            --success: #34a853; 
            --bg: #f4f7f9; 
            --text: #333;
        }

        body { 
            font-family: 'Assistant', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
            direction: rtl;
        }

        /* הגדרת חובה להסתרה */
        .hidden { display: none !important; }

        .container { max-width: 600px; margin: 0 auto; }

        /* כרטיסיות */
        .card-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; 
            margin-top: 20px; 
        }

        .link-card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            transition: 0.2s; 
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #eee;
        }

        .link-card.closed { 
            opacity: 0.6; 
            filter: grayscale(1); 
            cursor: not-allowed; 
        }

        .icon { font-size: 40px; margin-bottom: 10px; }
        .label { font-weight: bold; font-size: 16px; }
        .lock-msg { color: #d93025; font-size: 13px; margin-top: 8px; font-weight: bold; }
        
        /* מודאל (חלון קופץ לבקשה) */
        .modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.7); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000; 
        }

        .modal-content { 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 400px; 
            text-align: right; 
            max-height: 90vh;
            overflow-y: auto;
        }

        input, select { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: inherit;
        }

        button { 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            font-family: inherit;
            font-size: 16px;
        }

        .btn-main { background: var(--primary); color: white; }
        .btn-request { background: var(--success); color: white; margin-top: 40px; }
        .btn-logout { background: none; color: #666; text-decoration: underline; margin-top: 20px; font-size: 14px; }
        
        #loginError { color: red; margin-top: 10px; font-size: 14px; }

        /* מסך דפדפן פנימי (Iframe) */
        .browser-screen {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: white; 
            z-index: 2000;
            display: flex;
            flex-direction: column;
        }

        .browser-header {
            height: 60px; 
            background: #f4f7f9; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            border-bottom: 2px solid #ddd;
        }

        .browser-header button {
            width: auto; 
            padding: 8px 15px; 
            margin: 0; 
            background: var(--primary); 
            color: white; 
            border-radius: 5px;
        }

        .browser-title {
            margin-right: 15px; 
            font-weight: bold; 
            font-size: 18px;
            overflow: hidden; 
            white-space: nowrap; 
            text-overflow: ellipsis;
        }

        iframe {
            width: 100%; 
            flex-grow: 1; 
            border: none;
            background: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- מסך כניסה -->
        <div id="loginScreen">
            <h1>כניסה למערכת</h1>
            <p>הכנס את קוד הגישה שקיבלת:</p>
            <input type="tel" id="pinInput" placeholder="----" style="text-align:center; font-size:24px; letter-spacing: 4px;">
            <button class="btn-main" onclick="login()">כניסה</button>
            <div id="loginError"></div>
        </div>

        <!-- מסך ראשי - יוסתר עד להתחברות -->
        <div id="mainScreen" class="hidden">
            <h2 id="welcomeHeader">טוען...</h2>
            <div id="linksContainer" class="card-grid"></div>
            
            <button class="btn-request" onclick="openModal()">➕ בקשה לאתר חדש</button>
            <button class="btn-logout" onclick="logout()">התנתק מהחשבון</button>
        </div>
    </div>

    <!-- מודאל בקשה לאתר חדש -->
    <div id="requestModal" class="modal hidden">
        <div class="modal-content">
            <h3>בקשת אתר חדש</h3>
            <p style="font-size: 13px; color: #666;">האתר יופיע בדשבורד לאחר אישור מנהל המערכת.</p>
            
            <input type="text" id="reqName" placeholder="שם האתר (למשל: משחק מתמטיקה)">
            <input type="text" id="reqUrl" placeholder="כתובת האתר (URL) חובה">
            <input type="text" id="reqIcon" placeholder="אייקון (אימוג'י - אופציונלי)">
            
            <label style="font-weight: bold; display: block; margin-top: 15px;">באילו ימים האתר נחוץ?</label>
            <div id="daysSelect" style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin:10px 0;">
                <label><input type="checkbox" value="ראשון" checked> ראשון</label>
                <label><input type="checkbox" value="שני" checked> שני</label>
                <label><input type="checkbox" value="שלישי" checked> שלישי</label>
                <label><input type="checkbox" value="רביעי" checked> רביעי</label>
                <label><input type="checkbox" value="חמישי" checked> חמישי</label>
                <label><input type="checkbox" value="שישי"> שישי</label>
            </div>

            <label style="font-weight: bold; display: block; margin-top: 15px;">שעות פעילות מבוקשות:</label>
            <select id="reqHours">
                <option value="כל שעות היום">כל שעות היום</option>
                <option value="08:00-11:00">08:00-11:00</option>
                <option value="11:00-14:00">11:00-14:00</option>
                <option value="14:00-17:00">14:00-17:00</option>
                <option value="17:00-20:00">17:00-20:00</option>
                <option value="20:00-23:00">20:00-23:00</option>
            </select>

            <button class="btn-main" id="submitBtn" onclick="submitRequest()">שלח בקשה לאישור</button>
            <button onclick="closeModal()" style="background:#eee; color: #333;">ביטול</button>
        </div>
    </div>

    <!-- מסך הדפדפן הפנימי (Iframe) -->
    <div id="browserScreen" class="browser-screen hidden">
        <div class="browser-header">
            <button onclick="closeBrowser()">🔙 חזור</button>
            <span id="browserTitle" class="browser-title"></span>
        </div>
        <!-- כאן נטען האתר -->
        <iframe id="browserIframe"></iframe>
    </div>

<script>
    // הלינק של ה-API מהגוגל סקריפט שלך
    const API_URL = "https://script.google.com/macros/s/AKfycbypo3Sbc2v8moe9t43u7t_-o0h_ON7um4gcFHESJc-NfHyo7YZRzFHLemV9q1KiCk1b/exec";

    window.onload = () => {
        const pin = localStorage.getItem('userPin');
        if (pin) loadData(pin);
    };

    function login() {
        const pin = document.getElementById('pinInput').value;
        if (pin) loadData(pin);
    }

    async function loadData(pin) {
        document.getElementById('loginError').innerText = "טוען נתונים...";
        try {
            const res = await fetch(`${API_URL}?pin=${pin}`);
            const data = await res.json();
            
            if (data.success) {
                localStorage.setItem('userPin', pin);
                renderLinks(data);
            } else { 
                document.getElementById('loginError').innerText = data.message; 
            }
        } catch (e) { 
            document.getElementById('loginError').innerText = "שגיאת תקשורת עם השרת"; 
        }
    }

    function renderLinks(data) {
        document.getElementById('welcomeHeader').innerText = "שלום, " + data.user;
        const container = document.getElementById('linksContainer');
        container.innerHTML = "";
        
        data.links.forEach(link => {
            const card = document.createElement('div');
            card.className = `link-card ${link.isOpen ? '' : 'closed'}`;
            
            if (link.isOpen) {
                card.style.cursor = "pointer";
                // בלחיצה - פותחים את הקישור בדפדפן הפנימי
                card.onclick = () => openInBrowser(link.url, link.name);
            }
            
            card.innerHTML = `
                <div class="icon">${link.icon || '🔗'}</div>
                <div class="label">${link.name}</div>
                ${!link.isOpen && link.openingTime ? `<div class="lock-msg">🔒 ייפתח ב-${link.openingTime}</div>` : ''}
            `;
            container.appendChild(card);
        });
        
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainScreen').classList.remove('hidden');
    }

    // --- ניהול דפדפן פנימי ---
    function openInBrowser(url, name) {
        document.getElementById('browserTitle').innerText = name;
        document.getElementById('browserIframe').src = url;
        document.getElementById('browserScreen').classList.remove('hidden');
        
        // עצירת גלילה של המסך הראשי מתחת
        document.body.style.overflow = "hidden";
    }

    function closeBrowser() {
        document.getElementById('browserIframe').src = ""; // ניקוי ה-URL מפסיק אודיו/וידאו שמתנגנים
        document.getElementById('browserScreen').classList.add('hidden');
        
        // החזרת הגלילה למסך הראשי
        document.body.style.overflow = "auto";
    }

    // --- ניהול מודאל בקשת אתר ---
    function openModal() { document.getElementById('requestModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('requestModal').classList.add('hidden'); }

    async function submitRequest() {
        const pin = localStorage.getItem('userPin');
        const submitBtn = document.getElementById('submitBtn');
        const days = Array.from(document.querySelectorAll('#daysSelect input:checked')).map(c => c.value);
        
        const name = document.getElementById('reqName').value;
        const url = document.getElementById('reqUrl').value;
        
        if (!name || !url) {
            alert("חובה למלא שם אתר וכתובת");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "שולח בקשה...";

        const body = {
            pin: pin,
            name: name,
            url: url,
            icon: document.getElementById('reqIcon').value,
            days: days,
            hours: document.getElementById('reqHours').value
        };

        try {
            await fetch(API_URL, { 
                method: 'POST', 
                mode: 'no-cors', // מאפשר שליחת POST ל-Google Script מדומיין אחר
                body: JSON.stringify(body) 
            });
            
            alert("הבקשה נשלחה בהצלחה! היא ממתינה לאישור.");
            document.getElementById('reqName').value = "";
            document.getElementById('reqUrl').value = "";
            closeModal();
        } catch (e) {
            alert("שגיאה בשליחת הבקשה. אנא נסה שוב מאוחר יותר.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "שלח בקשה לאישור";
        }
    }

    function logout() { 
        localStorage.removeItem('userPin'); 
        location.reload(); 
    }
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <!-- Scene 3: voters queueing at the polling station, a tefillin stand by the entrance -->
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#sky3)"/>
  <g fill="#ffffff" opacity=".9">
    <ellipse cx="980" cy="60" rx="70" ry="20"/><ellipse cx="1030" cy="50" rx="44" ry="20"/>
    <ellipse cx="420" cy="50" rx="60" ry="18"/>
  </g>
  <!-- trees -->
  <g>
    <rect x="1120" y="200" width="14" height="130" fill="#7c5a3a"/><circle cx="1127" cy="190" r="50" fill="#5f9e4f"/>
    <rect x="60" y="210" width="14" height="120" fill="#7c5a3a"/><circle cx="67" cy="200" r="44" fill="#5f9e4f"/>
  </g>
  <rect y="330" width="1200" height="70" fill="#a3c78a"/>
  <rect y="316" width="1200" height="20" fill="#d9d2c5"/>

  <!-- school entrance with polling sign and arrow -->
  <rect x="780" y="110" width="320" height="210" fill="#f1e4c9"/>
  <rect x="760" y="96" width="360" height="20" fill="#c79c5f"/>
  <rect x="890" y="210" width="100" height="110" fill="#8a6d45"/>
  <rect x="860" y="140" width="160" height="50" rx="8" fill="#1e3a8a"/>
  <text x="940" y="174" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">← קלפי</text>

  <!-- queue of voters -->
  <g>
    <g transform="translate(590 0)">
      <rect x="0" y="246" width="44" height="78" rx="14" fill="#16a34a"/><circle cx="22" cy="224" r="18" fill="#e8b98f"/>
      <path d="M5 218 q17 -20 34 0" fill="#3b2a1a"/>
      <rect x="6" y="316" width="11" height="22" fill="#334155"/><rect x="27" y="316" width="11" height="22" fill="#334155"/>
    </g>
    <g transform="translate(660 0)">
      <rect x="0" y="240" width="48" height="84" rx="14" fill="#9333ea"/><circle cx="24" cy="216" r="19" fill="#f1c9a5"/>
      <path d="M4 214 q20 -26 40 0 v14 q-4 -18 -20 -18 q-16 0 -20 18z" fill="#6b3f1f"/>
      <rect x="8" y="316" width="12" height="22" fill="#334155"/><rect x="28" y="316" width="12" height="22" fill="#334155"/>
    </g>
    <g transform="translate(728 0)">
      <rect x="0" y="244" width="46" height="80" rx="14" fill="#ea580c"/><circle cx="23" cy="222" r="18" fill="#d9a066"/>
      <rect x="7" y="316" width="11" height="22" fill="#334155"/><rect x="28" y="316" width="11" height="22" fill="#334155"/>
      <rect x="38" y="262" width="16" height="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    </g>
  </g>

  <!-- tefillin stand near the queue -->
  <rect x="236" y="168" width="6" height="92" fill="#5b4a33"/><rect x="474" y="168" width="6" height="92" fill="#5b4a33"/>
  <rect x="186" y="120" width="344" height="58" rx="8" fill="#f59e0b"/>
  <text x="358" y="160" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a">הנחת תפילין לפני ההצבעה</text>
  <rect x="210" y="258" width="300" height="14" fill="#5b4a33"/>
  <rect x="214" y="270" width="292" height="56" fill="#1e3a8a"/>
  <rect x="214" y="286" width="292" height="6" fill="#ffffff"/>
  <rect x="300" y="236" width="22" height="22" fill="#111111"/><rect x="296" y="254" width="30" height="5" fill="#111111"/>
  <path d="M326 256 q28 -6 36 2" fill="none" stroke="#111111" stroke-width="4"/>
  <rect x="410" y="240" width="18" height="18" fill="#111111"/>

  <!-- two chassidim at the stand; one helps a voter put on tefillin -->
  <g>
    <rect x="130" y="240" width="54" height="86" rx="17" fill="#1f2937"/>
    <rect x="140" y="316" width="13" height="22" fill="#111827"/><rect x="161" y="316" width="13" height="22" fill="#111827"/>
    <circle cx="157" cy="214" r="21" fill="#f1c9a5"/>
    <path d="M140 222 q17 32 34 0 q-2 22 -17 25 q-15 -3 -17 -25z" fill="#5a3b24"/>
    <ellipse cx="157" cy="197" rx="32" ry="6" fill="#111111"/><rect x="140" y="178" width="34" height="21" rx="5" fill="#111111"/>
  </g>
  <g>
    <rect x="526" y="244" width="50" height="82" rx="16" fill="#0ea5e9"/>
    <rect x="534" y="316" width="13" height="22" fill="#334155"/><rect x="555" y="316" width="13" height="22" fill="#334155"/>
    <circle cx="551" cy="220" r="20" fill="#e8b98f"/>
    <!-- shel rosh on the forehead and strap on the arm -->
    <rect x="543" y="196" width="14" height="12" fill="#111111"/>
    <path d="M532 214 q19 -12 38 0" fill="none" stroke="#111111" stroke-width="3"/>
    <path d="M526 262 l-12 6 M526 274 l-12 6 M526 286 l-12 6" stroke="#111111" stroke-width="4"/>
  </g>
</svg>

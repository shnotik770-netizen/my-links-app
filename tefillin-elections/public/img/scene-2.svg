<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <!-- Scene 2: close-up of the tefillin table, with the ballot box of the polling station behind -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead8"/>
      <stop offset="1" stop-color="#e2d3b4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5e34"/>
      <stop offset="1" stop-color="#6b4423"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#wall)"/>
  <rect y="300" width="1200" height="100" fill="#cbbd9f"/>

  <!-- polling booth and ballot box (right) -->
  <rect x="860" y="70" width="230" height="230" fill="#dbe4f0" stroke="#94a3b8" stroke-width="4"/>
  <rect x="860" y="70" width="230" height="40" fill="#1e3a8a"/>
  <text x="975" y="99" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">ועדת קלפי</text>
  <rect x="900" y="190" width="150" height="110" rx="4" fill="#2563eb"/>
  <rect x="940" y="196" width="70" height="8" rx="4" fill="#0f172a"/>
  <rect x="955" y="150" width="40" height="52" fill="#ffffff" stroke="#94a3b8" stroke-width="3" transform="rotate(6 975 176)"/>
  <path d="M957 156 l20 16 l20 -16" fill="none" stroke="#94a3b8" stroke-width="3" transform="rotate(6 975 176)"/>
  <text x="975" y="262" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">קלפי</text>

  <!-- banner on the wall -->
  <rect x="120" y="40" width="560" height="80" rx="10" fill="#0f172a"/>
  <text x="400" y="93" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="40" font-weight="800" fill="#fbbf24">מבצע תפילין</text>

  <!-- table -->
  <rect x="80" y="230" width="720" height="22" rx="4" fill="url(#wood)"/>
  <rect x="110" y="252" width="16" height="110" fill="#6b4423"/><rect x="754" y="252" width="16" height="110" fill="#6b4423"/>

  <!-- tefillin shel rosh (box + base + straps) -->
  <g>
    <rect x="230" y="160" width="56" height="56" fill="#0b0b0b"/>
    <rect x="220" y="212" width="76" height="14" fill="#0b0b0b"/>
    <path d="M258 168 v40 M238 176 h40" stroke="#222" stroke-width="2"/>
    <path d="M296 220 q60 -10 70 8 q8 16 -30 10 q-40 -6 -10 -12" fill="none" stroke="#0b0b0b" stroke-width="7"/>
    <path d="M220 222 q-40 0 -60 6" fill="none" stroke="#0b0b0b" stroke-width="7"/>
  </g>
  <!-- tefillin shel yad -->
  <g>
    <rect x="440" y="176" width="44" height="44" fill="#0b0b0b"/>
    <rect x="432" y="216" width="60" height="12" fill="#0b0b0b"/>
    <path d="M492 222 q50 -2 60 -20 q10 -18 30 -4 q16 14 -6 22 q-40 12 -84 4" fill="none" stroke="#0b0b0b" stroke-width="7"/>
  </g>
  <!-- velvet tefillin bag -->
  <g>
    <path d="M620 228 v-74 q0 -10 10 -10 h90 q10 0 10 10 v74 z" fill="#7c2d12"/>
    <path d="M630 160 h90" stroke="#f59e0b" stroke-width="4"/>
    <text x="675" y="205" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="24" font-weight="700" fill="#fbbf24">תפילין</text>
  </g>
  <!-- small card on the table -->
  <rect x="330" y="236" width="150" height="40" rx="4" fill="#ffffff" stroke="#e5e7eb" transform="rotate(-3 405 256)"/>
  <text x="405" y="263" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a" transform="rotate(-3 405 256)">שמע ישראל</text>
</svg>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מבצע תפילין בקלפיות</title>
  <meta name="description" content="שיבוץ אנ״ש למבצע תפילין בקלפיות ביום הבחירות">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2026.10.25-141906">
</head>
<body>
  <div id="ticker" class="ticker hidden" role="marquee" aria-label="משפטי השראה"><div class="ticker-track" id="ticker-track"></div></div>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <a href="#/" class="hero-title" id="event-title">מבצע תפילין בקלפיות</a>
        <div class="hero-slogan">כל קול משפיע, <span>כל זוג תפילין מכריע!</span></div>
        <div class="hero-date" id="event-date"></div>
      </div>
      <!-- A ballot slip with the letter ש drops into the ballot box -->
      <div class="ballot" aria-hidden="true">
        <svg viewBox="0 0 120 124">
          <defs>
            <clipPath id="above-slot"><rect x="0" y="0" width="120" height="75"/></clipPath>
          </defs>
          <g clip-path="url(#above-slot)">
            <g class="slip">
              <rect x="26" y="2" width="68" height="72" rx="3" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
              <text x="60" y="37" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="32" font-weight="800" fill="#0f172a">ש</text>
              <text x="60" y="54" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">בחרתי לעשות</text>
              <text x="60" y="67" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a">מבצעים</text>
            </g>
          </g>
          <g class="box">
            <rect x="10" y="72" width="100" height="50" rx="6" fill="#fff" stroke="#14275a" stroke-width="3"/>
            <rect x="22" y="73.5" width="76" height="5" rx="2.5" fill="#14275a"/>
            <rect x="46" y="88" width="28" height="26" rx="4" fill="#14275a"/>
            <path d="M52 101 l6 6 l11 -12" fill="none" stroke="#ffd400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
    </div>
  </header>

  <main id="app" class="container">
    <div class="loader">טוען…</div>
  </main>

  <footer class="footer">
    <a href="#/admin" id="admin-link">כניסת מנהל</a>
  </footer>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="config.js?v=2026.10.25-141906"></script>
  <script src="api.js?v=2026.10.25-141906"></script>
  <script src="app.js?v=2026.10.25-141906"></script>
</body>
</html>

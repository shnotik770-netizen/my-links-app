<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מבצע תפילין בקלפיות</title>
  <meta name="description" content="שיבוץ אנ״ש למבצע תפילין בקלפיות ביום הבחירות">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2026.10.27-130327">
</head>
<body>
  <div id="ticker" class="ticker hidden" role="marquee" aria-label="משפטי השראה"><div class="ticker-track" id="ticker-track"></div></div>
  <header class="hero">
    <!-- Title box in the style of the campaign poster -->
    <div class="hero-card">
      <div class="hero-text">
        <a href="#/" class="hero-title">בואו למבצע תפילין</a>
        <div class="hero-sub">בכל הקלפיות המובחרות בעיר</div>
        <div class="hero-city"><i></i>עפולה<i></i></div>
      </div>
      <!-- Poster-style ballot box; the slip (ש, "בחרתי לעשות מבצעים") drops in and the box sways -->
      <div class="ballot" aria-hidden="true">
        <svg viewBox="0 0 120 132">
          <defs>
            <clipPath id="above-slot"><rect x="0" y="0" width="120" height="51"/></clipPath>
          </defs>
          <g clip-path="url(#above-slot)">
            <g transform="rotate(14 60 50)">
              <g class="slip">
                <rect x="34" y="-6" width="52" height="58" rx="3" fill="#fff"/>
                <text x="60" y="20" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="24" font-weight="800" fill="#14275a">ש</text>
                <text x="60" y="34" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="8.5" font-weight="800" fill="#14275a">בחרתי לעשות</text>
                <text x="60" y="44" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="8.5" font-weight="800" fill="#14275a">מבצעים</text>
              </g>
            </g>
          </g>
          <g class="box">
            <path d="M10 66 L24 48 H96 L110 66 V82 H10 Z" fill="#fff"/>
            <rect x="36" y="50" width="48" height="7" rx="3.5" fill="#14275a"/>
            <rect x="16" y="87" width="88" height="44" rx="5" fill="#fff"/>
            <rect x="42" y="94" width="36" height="30" rx="4" fill="#14275a"/>
            <path d="M50 109 l7 7 l13 -14" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="hero-date" id="event-date"></div>
  </header>

  <main id="app" class="container">
    <div class="loader">טוען…</div>
  </main>

  <footer class="footer">
    <a href="#/admin" id="admin-link">כניסת מנהל</a>
  </footer>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="config.js?v=2026.10.27-130327"></script>
  <script src="api.js?v=2026.10.27-130327"></script>
  <script src="app.js?v=2026.10.27-130327"></script>
</body>
</html>

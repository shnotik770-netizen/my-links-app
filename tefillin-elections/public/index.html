<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מבצע תפילין בקלפיות</title>
  <meta name="description" content="שיבוץ אנ״ש למבצע תפילין בקלפיות ביום הבחירות">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2026.10.24-184532">
</head>
<body>
  <div id="ticker" class="ticker hidden" role="marquee" aria-label="משפטי השראה"><div class="ticker-track" id="ticker-track"></div></div>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <a href="#/" class="hero-title" id="event-title">מבצע תפילין בקלפיות</a>
        <div class="hero-date" id="event-date"></div>
      </div>
      <!-- A ballot slip with the letter ש drops into the ballot box -->
      <div class="ballot" aria-hidden="true">
        <svg viewBox="0 0 100 92">
          <defs>
            <clipPath id="above-slot"><rect x="0" y="0" width="100" height="49"/></clipPath>
          </defs>
          <g clip-path="url(#above-slot)">
            <g class="slip">
              <rect x="36" y="4" width="28" height="36" rx="2" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
              <text x="50" y="31" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">ש</text>
            </g>
          </g>
          <g class="box">
            <rect x="14" y="46" width="72" height="44" rx="5" fill="#2563eb"/>
            <rect x="14" y="46" width="72" height="9" rx="4" fill="#1d4ed8"/>
            <rect x="32" y="47.5" width="36" height="4" rx="2" fill="#0f172a"/>
            <text x="50" y="79" text-anchor="middle" font-family="Assistant, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">קלפי</text>
          </g>
        </svg>
        <div class="ballot-caption">בחרתי לעשות מבצעים</div>
      </div>
    </div>
  </header>

  <main id="app" class="container">
    <div class="loader">טוען…</div>
  </main>

  <footer class="footer">
    <a href="#/admin" id="admin-link">כניסת מנהל</a>
  </footer>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="config.js?v=2026.10.24-184532"></script>
  <script src="api.js?v=2026.10.24-184532"></script>
  <script src="app.js?v=2026.10.24-184532"></script>
</body>
</html>
